      <!-- Locked Step 4 -->

      <!-- Active Step 5: Waiting for estimation -->

    <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--color-background);
      color: var(--color-primary);
      line-height: var(--line-height);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      max-width: var(--content-max-width);
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
    }

    /* Top navigation bar */
    .top-nav {
      height: var(--nav-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--space-md);
      border-bottom: 1px solid var(--color-border-light);
    }

    .back-btn {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: none;
      background: none;
      color: var(--color-primary);
    }

    .top-nav-title {
      font-size: var(--font-size-md);
      font-weight: 600;
      color: var(--color-primary);
    }

    .lock-icon {
      width: 20px;
      height: 20px;
      color: var(--color-primary);
    }

    /* Info section */
    .info-section {
      padding: var(--space-lg) var(--space-md) var(--space-md);
    }

    .info-title {
      font-size: var(--font-size-xl);
      font-weight: 700;
      color: var(--color-primary);
      margin-bottom: var(--space-sm);
    }

    .info-subtitle {
      font-size: var(--font-size-sm);
      color: var(--color-primary-light);
      margin-bottom: var(--space-xs);
    }

    .info-price {
      font-size: var(--font-size-xs);
      color: var(--color-primary-lighter);
      line-height: 1.6;
    }

    /* Step indicator */
    .step-indicator {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-md) var(--space-lg);
      margin: var(--space-md) var(--space-md);
      background-color: var(--color-surface);
      border-radius: var(--radius-md);
    }

    .step-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      position: relative;
    }

    .step-circle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--font-size-xs);
      font-weight: 600;
      margin-bottom: 6px;
      transition: all 0.3s ease;
    }

    .step-circle.done {
      background-color: var(--color-success);
      color: var(--color-background);
    }

    .step-circle.active {
      background-color: var(--color-primary);
      color: var(--color-background);
    }

    .step-circle.inactive {
      background-color: var(--color-border);
      color: var(--color-primary-lighter);
    }

    .step-label {
      font-size: 10px;
      color: var(--color-primary-lighter);
      text-align: center;
      white-space: nowrap;
    }

    .step-label.done {
      color: var(--color-success);
    }

    .step-label.active {
      color: var(--color-primary);
      font-weight: 600;
    }

    .step-line {
      flex: 1;
      height: 2px;
      background-color: var(--color-border);
      margin: 0 4px;
      margin-bottom: 20px;
    }

    .step-line.done {
      background-color: var(--color-success);
    }

    /* Main content area - two column layout */
    .main-content {
      display: flex;
      padding: var(--space-md);
      gap: var(--space-md);
    }

    /* Left column - locked image area */
    .image-column {
      flex: 0 0 40%;
      max-width: 40%;
    }

    .image-zone-locked {
      width: 179px;
      height: 260px;
      border-radius: var(--radius-md);
      background-color: var(--color-surface);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .image-zone-locked::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(16,16,16,0.02) 0%, rgba(16,16,16,0.06) 100%);
    }

    .locked-overlay {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-sm);
      z-index: 1;
    }

    .locked-icon {
      width: 36px;
      height: 36px;
      color: var(--color-primary-lighter);
    }

    .locked-text {
      font-size: var(--font-size-xs);
      color: var(--color-primary-lighter);
    }

    /* Right column - steps */
    .form-column {
      flex: 1;
      min-width: 0;
    }

    /* Locked steps (compact, gray) */
    .locked-step {
      margin-bottom: var(--space-lg);
      opacity: 0.4;
    }

    .locked-step-title {
      font-size: var(--font-size-xs);
      color: var(--color-primary);
      font-weight: 600;
      margin-bottom: 2px;
    }

    .locked-step-value {
      font-size: var(--font-size-xs);
      color: var(--color-primary-light);
    }

    .locked-step-value .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      background-color: var(--color-surface);
      border-radius: var(--radius-full);
      font-size: 10px;
      color: var(--color-primary-light);
      margin-right: 4px;
      margin-top: 2px;
    }

    .locked-step-value .tag svg {
      width: 10px;
      height: 10px;
      color: var(--color-success);
    }

    .locked-step-note {
      font-size: 9px;
      color: var(--color-primary-lighter);
      margin-top: 2px;
      line-height: 1.5;
    }

    /* Active step */
    .active-step {
      margin-bottom: var(--space-lg);
    }

    .active-step-title {
      font-size: var(--font-size-md);
      font-weight: 600;
      color: var(--color-primary);
      margin-bottom: var(--space-md);
      line-height: var(--line-height-tight);
    }

    /* Waiting state */
    .waiting-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: var(--space-md) 0;
    }

    .waiting-text {
      font-size: var(--font-size-sm);
      color: var(--color-primary-light);
      line-height: 1.6;
      max-width: 200px;
    }

    .order-code {
      font-size: var(--font-size-xs);
      color: var(--color-primary-light);
      margin-top: var(--space-lg);
      padding: var(--space-sm) var(--space-md);
      background-color: var(--color-surface);
      border-radius: var(--radius-sm);
      word-break: break-all;
      letter-spacing: 0.05em;
    }

    /* Spinner animation */
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--color-border);
      border-top-color: var(--color-primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-top: var(--space-lg);
    }

    /* Bottom spacer */
    .bottom-spacer {
      height: calc(var(--bottom-nav-height) + var(--space-xl));
    }

    /* Locked image fill */
    .locked-image-fill {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }

    .locked-image-fill img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>

  <script>
    (function() {
      try {
        var imgData = sessionStorage.getItem('longwoo_design_ref_image');
        if (imgData) {
          var overlay = document.getElementById('lockedOverlay');
          var fill = document.getElementById('lockedImageFill');
          var img = document.getElementById('lockedImage');
          overlay.style.display = 'none';
          fill.style.display = 'flex';
          img.src = imgData;
        }
      } catch (err) {}

      // 展示真实订单号（由第 4 步联系方式提交时创建并写入 sessionStorage）
      try {
        var orderNo = sessionStorage.getItem('longwoo_order_no');
        var codeEl = document.getElementById('orderCode');
        if (orderNo && codeEl) {
          codeEl.textContent = '您的订单代码：' + orderNo;
        }
      } catch (err) {}
    })();
  </script>
<script src="/js/common.js" defer></script>
</body>
</html>
