    <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--color-background);
      color: var(--color-primary);
      line-height: var(--line-height);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      max-width: var(--content-max-width);
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
    }

    /* Top navigation bar */
    .top-nav {
      height: var(--nav-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--space-md);
      border-bottom: 1px solid var(--color-border-light);
    }

    .back-btn {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: none;
      background: none;
      color: var(--color-primary);
    }

    .top-nav-title {
      font-size: var(--font-size-md);
      font-weight: 600;
      color: var(--color-primary);
    }

    .lock-icon {
      width: 20px;
      height: 20px;
      color: var(--color-primary);
    }

    /* Info section */
    .info-section {
      padding: var(--space-lg) var(--space-md) var(--space-md);
    }

    .info-title {
      font-size: var(--font-size-xl);
      font-weight: 700;
      color: var(--color-primary);
      margin-bottom: var(--space-sm);
    }

    .info-subtitle {
      font-size: var(--font-size-sm);
      color: var(--color-primary-light);
      margin-bottom: var(--space-xs);
    }

    .info-price {
      font-size: var(--font-size-xs);
      color: var(--color-primary-lighter);
      line-height: 1.6;
    }

    /* Step indicator */
    .step-indicator {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-md) var(--space-lg);
      margin: var(--space-md) var(--space-md);
      background-color: var(--color-surface);
      border-radius: var(--radius-md);
    }

    .step-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      position: relative;
    }

    .step-circle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--font-size-xs);
      font-weight: 600;
      margin-bottom: 6px;
      transition: all 0.3s ease;
    }

    .step-circle.done {
      background-color: var(--color-success);
      color: var(--color-background);
    }

    .step-circle.active {
      background-color: var(--color-primary);
      color: var(--color-background);
    }

    .step-circle.inactive {
      background-color: var(--color-border);
      color: var(--color-primary-lighter);
    }

    .step-label {
      font-size: 10px;
      color: var(--color-primary-lighter);
      text-align: center;
      white-space: nowrap;
    }

    .step-label.done {
      color: var(--color-success);
    }

    .step-label.active {
      color: var(--color-primary);
      font-weight: 600;
    }

    .step-line {
      flex: 1;
      height: 2px;
      background-color: var(--color-border);
      margin: 0 4px;
      margin-bottom: 20px;
    }

    .step-line.done {
      background-color: var(--color-success);
    }

    /* State separator */
    .state-separator {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      padding: var(--space-xl) var(--space-md) var(--space-md);
    }

    .state-separator-label {
      font-size: var(--font-size-xs);
      font-weight: 600;
      color: var(--color-primary-lighter);
      white-space: nowrap;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .state-separator-line {
      flex: 1;
      height: 1px;
      background-color: var(--color-border-light);
    }

    /* Payment section */
    .payment-section {
      padding: var(--space-md);
    }

    .payment-title {
      font-size: var(--font-size-md);
      font-weight: 600;
      color: var(--color-primary);
      margin-bottom: var(--space-md);
      line-height: var(--line-height-tight);
    }

    /* Payment details card */
    .payment-card {
      background-color: var(--color-surface);
      border-radius: var(--radius-md);
      padding: var(--space-md);
      margin-bottom: var(--space-md);
    }

    .payment-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
    }

    .payment-row-label {
      font-size: var(--font-size-sm);
      color: var(--color-primary-light);
    }

    .payment-row-value {
      font-size: var(--font-size-sm);
      color: var(--color-primary);
    }

    .payment-row.discount .payment-row-value {
      color: var(--color-success);
    }

    .payment-divider {
      height: 1px;
      background-color: var(--color-border);
      margin: 8px 0;
    }

    .payment-row.total {
      padding-top: var(--space-sm);
    }

    .payment-row.total .payment-row-label {
      font-weight: 700;
      color: var(--color-primary);
      font-size: var(--font-size-lg);
    }

    .payment-row.total .payment-row-value {
      font-weight: 700;
      color: var(--color-primary);
      font-size: var(--font-size-lg);
    }

    .deposit-note {
      font-size: var(--font-size-xs);
      color: var(--color-primary-light);
      margin-top: var(--space-sm);
      padding-top: var(--space-sm);
      border-top: 1px dashed var(--color-border);
      text-align: center;
    }

    /* Pay button */
    .pay-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 48px;
      background-color: var(--color-primary);
      color: var(--color-background);
      border: none;
      border-radius: var(--radius-sm);
      font-size: var(--font-size-lg);
      font-weight: 600;
      font-family: var(--font-family);
      cursor: pointer;
      letter-spacing: 0.15em;
      transition: opacity 0.2s;
    }

    .pay-btn:hover {
      opacity: 0.85;
    }

    /* Terms */
    .terms-text {
      text-align: center;
      font-size: var(--font-size-xs);
      color: var(--color-primary-lighter);
      margin-top: var(--space-md);
    }

    .terms-link {
      color: var(--color-primary-light);
      text-decoration: underline;
      cursor: pointer;
    }

    /* Payment success section */
    .success-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: var(--space-xl) var(--space-md) var(--space-md);
    }

    .success-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background-color: var(--color-success);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: var(--space-lg);
    }

    .success-icon svg {
      width: 24px;
      height: 24px;
      color: var(--color-background);
    }

    .success-title {
      font-size: var(--font-size-xl);
      font-weight: 700;
      color: var(--color-primary);
      margin-bottom: var(--space-sm);
    }

    .success-subtitle {
      font-size: var(--font-size-sm);
      color: var(--color-primary-light);
      margin-bottom: var(--space-xs);
    }

    .success-desc {
      font-size: var(--font-size-xs);
      color: var(--color-primary-lighter);
      line-height: 1.6;
      max-width: 240px;
    }

    .success-order-code {
      font-size: var(--font-size-xs);
      color: var(--color-primary-light);
      margin-top: var(--space-lg);
      padding: var(--space-sm) var(--space-md);
      background-color: var(--color-surface);
      border-radius: var(--radius-sm);
      word-break: break-all;
      letter-spacing: 0.05em;
    }

    /* Bottom navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: var(--content-max-width);
      height: var(--bottom-nav-height);
      background-color: var(--color-background);
      border-top: 1px solid var(--color-border-light);
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      text-decoration: none;
      border: none;
      background: none;
      padding: var(--space-xs) var(--space-sm);
    }

    .nav-item svg {
      width: 24px;
      height: 24px;
    }

    .nav-item span {
      font-size: 10px;
      color: var(--color-primary-lighter);
    }

    .nav-item.active svg {
      color: var(--color-primary);
    }

    .nav-item.active span {
      color: var(--color-primary);
      font-weight: 600;
    }

    /* Bottom spacer */
    .bottom-spacer {
      height: calc(var(--bottom-nav-height) + var(--space-xl));
    }
  </style>

  <script>
    function confirmPayment() {
      // 清理会话数据，设计稿中保留状态展示
      try {
        sessionStorage.removeItem('longwoo_design_ref_image');
        sessionStorage.removeItem('longwoo_design_ref_name');
        sessionStorage.removeItem('longwoo_design_ref_size');
      } catch (e) {}
      // 滚动到付款完成状态
      var success = document.querySelector('.success-section');
      if (success) success.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  </script>
</body>
</html>
