    <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--color-background);
      color: var(--color-primary);
      line-height: var(--line-height);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      max-width: var(--content-max-width);
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
    }

    /* Top navigation bar */
    .top-nav {
      height: var(--nav-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--space-md);
      border-bottom: 1px solid var(--color-border-light);
    }

    .back-btn {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: none;
      background: none;
      color: var(--color-primary);
    }

    .top-nav-title {
      font-size: var(--font-size-md);
      font-weight: 600;
      color: var(--color-primary);
    }

    .lock-icon {
      width: 20px;
      height: 20px;
      color: var(--color-primary);
    }

    /* Info section */
    .info-section {
      padding: var(--space-lg) var(--space-md) var(--space-md);
    }

    .info-title {
      font-size: var(--font-size-xl);
      font-weight: 700;
      color: var(--color-primary);
      margin-bottom: var(--space-sm);
    }

    .info-subtitle {
      font-size: var(--font-size-sm);
      color: var(--color-primary-light);
      margin-bottom: var(--space-xs);
    }

    .info-price {
      font-size: var(--font-size-xs);
      color: var(--color-primary-lighter);
      line-height: 1.6;
    }

    /* Step indicator */
    .step-indicator {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-md) var(--space-lg);
      margin: var(--space-md) var(--space-md);
      background-color: var(--color-surface);
      border-radius: var(--radius-md);
    }

    .step-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      position: relative;
    }

    .step-circle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--font-size-xs);
      font-weight: 600;
      margin-bottom: 6px;
      transition: all 0.3s ease;
    }

    .step-circle.done {
      background-color: var(--color-success);
      color: var(--color-background);
    }

    .step-circle.active {
      background-color: var(--color-primary);
      color: var(--color-background);
    }

    .step-circle.inactive {
      background-color: var(--color-border);
      color: var(--color-primary-lighter);
    }

    .step-label {
      font-size: 10px;
      color: var(--color-primary-lighter);
      text-align: center;
      white-space: nowrap;
    }

    .step-label.done {
      color: var(--color-success);
    }

    .step-label.active {
      color: var(--color-primary);
      font-weight: 600;
    }

    .step-line {
      flex: 1;
      height: 2px;
      background-color: var(--color-border);
      margin: 0 4px;
      margin-bottom: 20px;
    }

    .step-line.done {
      background-color: var(--color-success);
    }

    /* Main content area - two column layout */
    .main-content {
      display: flex;
      padding: var(--space-md);
      gap: var(--space-md);
    }

    /* Left column - locked image preview (与其余步骤页统一) */
    .locked-column {
      flex: 0 0 40%;
      max-width: 40%;
    }

    .locked-zone {
      border-radius: var(--radius-md);
      padding: var(--space-md);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 260px;
      background-color: var(--color-surface);
      text-align: center;
      opacity: 0.45;
    }

    .locked-thumbnail {
      width: 100%;
      aspect-ratio: 3/4;
      border-radius: var(--radius-sm);
      background-color: var(--color-border);
      margin-bottom: var(--space-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .locked-thumbnail svg {
      width: 32px;
      height: 32px;
      color: var(--color-primary-lighter);
    }

    .locked-text {
      font-size: var(--font-size-xs);
      color: var(--color-primary-lighter);
    }

    .locked-overlay {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-sm);
      z-index: 1;
    }

    .locked-icon {
      width: 36px;
      height: 36px;
      color: var(--color-primary-lighter);
    }

    .locked-text {
      font-size: var(--font-size-xs);
      color: var(--color-primary-lighter);
    }

    /* Right column - steps and form */
    .form-column {
      flex: 1;
      min-width: 0;
    }

    /* Locked steps (compact, gray) */
    .locked-step {
      margin-bottom: var(--space-lg);
      opacity: 0.4;
    }

    .locked-step-title {
      font-size: var(--font-size-xs);
      color: var(--color-primary);
      font-weight: 600;
      margin-bottom: 2px;
    }

    .locked-step-value {
      font-size: var(--font-size-xs);
      color: var(--color-primary-light);
    }

    .locked-step-value .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      background-color: var(--color-surface);
      border-radius: var(--radius-full);
      font-size: 10px;
      color: var(--color-primary-light);
      margin-right: 4px;
      margin-top: 2px;
    }

    .locked-step-value .tag svg {
      width: 10px;
      height: 10px;
      color: var(--color-success);
    }

    .locked-step-note {
      font-size: 9px;
      color: var(--color-primary-lighter);
      margin-top: 2px;
      line-height: 1.5;
    }

    /* Active step 4 */
    .active-step {
      margin-bottom: var(--space-lg);
    }

    .active-step-title {
      font-size: var(--font-size-md);
      font-weight: 600;
      color: var(--color-primary);
      margin-bottom: var(--space-md);
      line-height: var(--line-height-tight);
    }

    /* Form grid */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-sm);
    }

    .form-grid .full-width {
      grid-column: 1 / -1;
    }

    .form-field {
      display: flex;
      flex-direction: column;
    }

    .form-field label {
      font-size: 10px;
      color: var(--color-primary-light);
      margin-bottom: 4px;
      font-weight: 500;
    }

    .form-field input,
    .form-field textarea {
      background-color: var(--color-surface);
      border: 1px solid var(--color-border-light);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      font-size: var(--font-size-base);
      font-family: var(--font-family);
      color: var(--color-primary);
      outline: none;
      transition: border-color 0.2s;
      width: 100%;
      resize: none;
    }

    .form-field input::placeholder,
    .form-field textarea::placeholder {
      color: var(--color-primary-lighter);
    }

    .form-field input:focus,
    .form-field textarea:focus {
      border-color: var(--color-primary-light);
    }

    .form-field textarea {
      min-height: 72px;
    }

    /* Submit button */
    .submit-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 44px;
      background-color: var(--color-primary);
      color: var(--color-background);
      border: none;
      border-radius: var(--radius-sm);
      font-size: var(--font-size-md);
      font-weight: 600;
      font-family: var(--font-family);
      cursor: pointer;
      letter-spacing: 0.1em;
      margin-top: var(--space-md);
      transition: opacity 0.2s;
    }

    .submit-btn:hover {
      opacity: 0.85;
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .req-star {
      color: var(--color-error);
    }

    /* 必填校验失败：红框 + 闪烁 */
    .field-invalid {
      border-color: var(--color-error) !important;
      animation: field-flash 0.8s ease 3;
    }

    .field-invalid:focus {
      outline-color: var(--color-error) !important;
    }

    @keyframes field-flash {
      0%, 100% { border-color: var(--color-error); box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.15); }
      50% { border-color: transparent; box-shadow: none; }
    }

    .form-tip {
      font-size: var(--font-size-xs);
      color: var(--color-error);
      margin-top: var(--space-sm);
      min-height: 14px;
      text-align: center;
    }

    /* Price summary */
    .price-summary {
      margin: var(--space-md);
      padding: var(--space-md);
      background-color: var(--color-surface);
      border-radius: var(--radius-md);
      content-visibility: auto;
      contain-intrinsic-size: 180px;
    }

    .price-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
    }

    .price-row-label {
      font-size: var(--font-size-sm);
      color: var(--color-primary-light);
    }

    .price-row-value {
      font-size: var(--font-size-sm);
      color: var(--color-primary);
    }

    .price-row.discount .price-row-value {
      color: var(--color-success);
    }

    .price-row.total {
      border-top: 1px solid var(--color-border);
      margin-top: var(--space-xs);
      padding-top: var(--space-sm);
    }

    .price-row.total .price-row-label {
      font-weight: 600;
      color: var(--color-primary);
      font-size: var(--font-size-base);
    }

    .price-row.total .price-row-value {
      font-weight: 700;
      color: var(--color-primary);
      font-size: var(--font-size-base);
    }

    /* Bottom spacer */
    .bottom-spacer {
      height: calc(var(--bottom-nav-height) + var(--space-lg));
    }

    /* Locked image fill */
    .locked-image-fill {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }

    .locked-image-fill img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>

  <script>
    (function() {
      // ---- 设定图恢复（来自 step1）----
      try {
        var imgData = sessionStorage.getItem('longwoo_design_ref_image');
        if (imgData) {
          var overlay = document.getElementById('lockedOverlay');
          var fill = document.getElementById('lockedImageFill');
          var img = document.getElementById('lockedImage');
          overlay.style.display = 'none';
          fill.style.display = 'flex';
          img.src = imgData;
        }
      } catch (err) {}

      // ---- 表单字段与 sessionStorage key 映射 ----
      var FIELD_KEYS = [
        ['contactName', 'longwoo_contact_name'],
        ['contactPhone', 'longwoo_contact_phone'],
        ['contactEmail', 'longwoo_contact_email'],
        ['bodyHeight', 'longwoo_body_height'],
        ['bodyWeight', 'longwoo_body_weight'],
        ['bodyChest', 'longwoo_body_chest'],
        ['bodyWaist', 'longwoo_body_waist'],
        ['bodyHip', 'longwoo_body_hip'],
        ['shoeSize', 'longwoo_shoe_size'],
        ['socialAccount', 'longwoo_social_account']
      ];

      // 页面加载时从 sessionStorage 恢复已填数据（避免刷新丢失）
      FIELD_KEYS.forEach(function(pair) {
        var el = document.getElementById(pair[0]);
        if (!el) return;
        try {
          var v = sessionStorage.getItem(pair[1]);
          if (v !== null) el.value = v;
        } catch (e) {}
      });

      // 输入时实时保存
      FIELD_KEYS.forEach(function(pair) {
        var el = document.getElementById(pair[0]);
        if (!el) return;
        el.addEventListener('input', function() {
          try { sessionStorage.setItem(pair[1], el.value); } catch (e) {}
        });
      });

      var submitBtn = document.getElementById('submitBtn');
      var formTip = document.getElementById('formTip');

      // ---- 价格自适应：基础 18,000 + 附加（step2 选配）- 折抵（step3 权益）= 合计 ----
      function updatePriceSummary() {
        try {
          var addon = parseInt(sessionStorage.getItem('longwoo_step2_addon_amount') || '0', 10) || 0;
          var discount = parseInt(sessionStorage.getItem('longwoo_step3_benefit_amount') || '0', 10) || 0;
          var base = 18000;
          var total = base + addon - discount;
          var addonEl = document.getElementById('addonPrice');
          var discountEl = document.getElementById('discountPrice');
          var totalEl = document.getElementById('totalPrice');
          if (addonEl) addonEl.textContent = 'RMB ' + addon.toLocaleString('en-US');
          if (discountEl) discountEl.textContent = discount > 0 ? '- RMB ' + discount.toLocaleString('en-US') : 'RMB 0';
          if (totalEl) totalEl.textContent = 'RMB ' + total.toLocaleString('en-US');
        } catch (e) {}
      }
      updatePriceSummary();

      // ---- 必填项校验：焦点定位 + 标红闪烁 ----
      var REQUIRED_FIELDS = [
        { id: 'contactName', message: '请输入姓名' },
        { id: 'contactPhone', message: '请输入有效的手机号', validator: function(v) { return /^1[3-9]\d{9}$/.test(v); } },
        { id: 'contactEmail', message: '请输入有效的邮箱', validator: function(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); } }
      ];

      function clearInvalid(el) {
        if (el) el.classList.remove('field-invalid');
      }

      // 输入时清除错误态
      REQUIRED_FIELDS.forEach(function(field) {
        var el = document.getElementById(field.id);
        if (el) el.addEventListener('input', function() { clearInvalid(el); });
      });

      function validateRequired() {
        var firstInvalid = null;
        for (var i = 0; i < REQUIRED_FIELDS.length; i++) {
          var field = REQUIRED_FIELDS[i];
          var el = document.getElementById(field.id);
          if (!el) continue;
          var value = (el.value || '').trim();
          var ok = field.validator ? field.validator(value) : value.length > 0;
          if (!ok) {
            el.classList.remove('field-invalid');
            // 强制重排以重新触发闪烁动画
            void el.offsetWidth;
            el.classList.add('field-invalid');
            if (!firstInvalid) {
              firstInvalid = field;
              try { el.focus(); } catch (e) {}
              try { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) {}
            }
          }
        }
        return firstInvalid;
      }

      function showTip(msg) {
        if (formTip) {
          formTip.textContent = msg;
          formTip.style.color = 'var(--color-error)';
        }
      }

      // 拼接需求描述（与旧付款页 order-step5 逻辑一致，保证落库格式相同）
      function buildRequirements() {
        function get(k) {
          try { return sessionStorage.getItem(k) || ''; } catch (e) { return ''; }
        }
        var lines = [];
        lines.push('【下单来源】自设兽装购买流程（静态页下单）');
        var designRefName = get('longwoo_design_ref_name');
        var addonOption = get('longwoo_step2_addon');
        var benefitOption = get('longwoo_step3_benefit');
        var addonAmount = get('longwoo_step2_addon_amount');
        var benefitAmount = get('longwoo_step3_benefit_amount');
        if (designRefName) lines.push('【设定图】' + designRefName);
        if (addonOption) lines.push('【选配内容】' + addonOption);
        if (benefitOption) lines.push('【折抵权益】' + benefitOption);
        // 记录价格明细，便于人工估价核对
        var priceLines = [];
        priceLines.push('基础价格 RMB 18,000');
        priceLines.push('附加选项 RMB ' + (parseInt(addonAmount, 10) || 0));
        priceLines.push('折抵 RMB -' + (parseInt(benefitAmount, 10) || 0));
        priceLines.push('合计 RMB ' + (18000 + (parseInt(addonAmount, 10) || 0) - (parseInt(benefitAmount, 10) || 0)));
        lines.push('【价格明细】' + priceLines.join('，'));
        var body = [];
        var bh = get('longwoo_body_height'); if (bh) body.push('身高' + bh + 'CM');
        var bw = get('longwoo_body_weight'); if (bw) body.push('体重' + bw + 'KG');
        var bc = get('longwoo_body_chest'); if (bc) body.push('胸围' + bc + 'CM');
        var bwa = get('longwoo_body_waist'); if (bwa) body.push('腰围' + bwa + 'CM');
        var bhi = get('longwoo_body_hip'); if (bhi) body.push('臀围' + bhi + 'CM');
        var ss = get('longwoo_shoe_size'); if (ss) body.push('鞋码' + ss);
        if (body.length) lines.push('【身体数据】' + body.join('，'));
        var sa = get('longwoo_social_account');
        if (sa) lines.push('【社交账号】' + sa);
        return lines.join('\n');
      }

      // 提交：校验 -> 创建订单 -> 保存订单号 -> 进入等待估价页
      submitBtn.addEventListener('click', async function() {
        var invalid = validateRequired();
        if (invalid) { showTip(invalid.message); return; }

        var name = (document.getElementById('contactName').value || '').trim();
        var phone = (document.getElementById('contactPhone').value || '').trim();
        var email = (document.getElementById('contactEmail').value || '').trim();

        // 保存全部字段到 sessionStorage
        FIELD_KEYS.forEach(function(pair) {
          var el = document.getElementById(pair[0]);
          if (!el) return;
          try { sessionStorage.setItem(pair[1], el.value || ''); } catch (e) {}
        });

        // 提交中状态
        submitBtn.disabled = true;
        submitBtn.textContent = '提交中...';
        showTip('');

        try {
          // 创建订单（此时立即落库，等待估价页展示真实订单号）
          var res = await fetch('/api/order/create', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              customerName: name,
              customerPhone: phone,
              customerEmail: email,
              requirements: buildRequirements()
            })
          });
          var result = await res.json();

          if (result.success && result.orderNo) {
            try { sessionStorage.setItem('longwoo_order_no', result.orderNo); } catch (e) {}

            // 上传设定图（如果用户在第 1 步选择了图片）
            // 订单已创建成功，上传失败不阻断下单流程（静默记录）
            var designRefImage = '';
            try { designRefImage = sessionStorage.getItem('longwoo_design_ref_image') || ''; } catch (e) {}
            var designRefName = '';
            try { designRefName = sessionStorage.getItem('longwoo_design_ref_name') || ''; } catch (e) {}

            if (result.orderId && result.uploadToken && designRefImage) {
              try {
                var upRes = await fetch('/api/order/upload-attachment', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    orderId: result.orderId,
                    uploadToken: result.uploadToken,
                    fileName: designRefName,
                    dataUrl: designRefImage
                  })
                });
                var upResult = await upRes.json().catch(function () { return { success: false }; });
                if (!upRes.ok || !upResult.success) {
                  // 上传失败：不再静默吞错，明确告知用户（不阻断下单跳转）
                  var failTip = (upResult && upResult.error) ? upResult.error : '图片过大或格式不支持';
                  alert('设定图上传失败：' + failTip + '。文件名已随订单保存，您可稍后登录个人中心补充设定图，或联系客服协助上传。');
                }
              } catch (e) {
                alert('设定图上传失败（网络异常）。文件名已随订单保存，您可稍后登录个人中心补充设定图，或联系客服协助上传。');
              }
            }

            window.location.href = 'order-step5.html';
          } else {
            showTip(result.error || '提交失败，请重试');
            submitBtn.disabled = false;
            submitBtn.textContent = '提 交';
          }
        } catch (e) {
          showTip('网络错误，请稍后重试');
          submitBtn.disabled = false;
          submitBtn.textContent = '提 交';
        }
      });
    })();
  </script>
<script src="/js/common.js" defer></script>
</body>
</html>
