  <script>
    // ===== 协议勾选 =====
    function toggleCheckbox() {
      const checkbox = document.getElementById('checkboxIcon');
      checkbox.classList.toggle('checked');
    }

    // ===== 产品信息恢复（来自第一步选择） =====
    function getSelectedDrop() {
      try {
        var raw = sessionStorage.getItem('longwoo_preorder_product');
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return null;
    }

    (function () {
      var drop = getSelectedDrop();
      var nameEl = document.getElementById('dropProductName');
      if (drop && nameEl && (drop.title || drop.price != null)) {
        var price = drop.price != null ? 'RMB ' + Number(drop.price).toLocaleString('zh-CN') : '';
        nameEl.textContent = [price, drop.title].filter(Boolean).join(' / ');
      }
    })();

    // ===== 必填校验：焦点定位 + 标红闪烁 =====
    var REQUIRED_FIELDS = [
      { id: 'dropName', message: '请输入姓名' },
      { id: 'dropPhone', message: '请输入有效的手机号', validator: function (v) { return /^1[3-9]\d{9}$/.test(v); } },
      { id: 'dropEmail', message: '请输入有效的邮箱', validator: function (v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); } }
    ];

    REQUIRED_FIELDS.forEach(function (field) {
      var el = document.getElementById(field.id);
      if (el) el.addEventListener('input', function () { el.classList.remove('field-invalid'); });
    });

    function validateRequired() {
      var firstInvalid = null;
      REQUIRED_FIELDS.forEach(function (field) {
        var el = document.getElementById(field.id);
        if (!el) return;
        var value = (el.value || '').trim();
        var ok = field.validator ? field.validator(value) : value.length > 0;
        if (!ok) {
          el.classList.remove('field-invalid');
          void el.offsetWidth;
          el.classList.add('field-invalid');
          if (!firstInvalid) {
            firstInvalid = field;
            try { el.focus(); } catch (e) {}
            try { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) {}
          }
        }
      });
      return firstInvalid;
    }

    // ===== 提交：校验 -> 创建订单 -> 保存订单号 -> 进入完成页 =====
    function buildRequirements() {
      function get(id) {
        var el = document.getElementById(id);
        return el ? (el.value || '').trim() : '';
      }
      var drop = getSelectedDrop();
      var lines = [];
      lines.push('【下单来源】预设兽装（掉落）购买流程（静态页下单）');
      var productName = drop && drop.title ? drop.title : '未指定';
      var productPrice = drop && drop.price != null ? Number(drop.price) : 0;
      lines.push('【掉落产品】' + productName);
      lines.push('【价格明细】产品价格 RMB ' + productPrice);
      var body = [];
      var h = get('dropHeight'); if (h) body.push('身高' + h + 'CM');
      var w = get('dropWeight'); if (w) body.push('体重' + w + 'KG');
      var c = get('dropChest'); if (c) body.push('胸围' + c + 'CM');
      var wa = get('dropWaist'); if (wa) body.push('腰围' + wa + 'CM');
      var hi = get('dropHip'); if (hi) body.push('臀围' + hi + 'CM');
      var ss = get('dropShoe'); if (ss) body.push('鞋码' + ss);
      if (body.length) lines.push('【身体数据】' + body.join('，'));
      var sa = get('dropSocial');
      if (sa) lines.push('【社交账号】' + sa);
      return lines.join('\n');
    }

    async function submitPreorder() {
      var invalid = validateRequired();
      var tip = document.getElementById('dropFormTip');
      if (invalid) {
        if (tip) { tip.textContent = invalid.message; tip.style.color = 'var(--color-error, #ef4444)'; }
        return;
      }
      // 协议勾选校验
      var checkbox = document.getElementById('checkboxIcon');
      if (!checkbox.classList.contains('checked')) {
        if (tip) { tip.textContent = '请先阅读并同意购买协议'; tip.style.color = 'var(--color-error, #ef4444)'; }
        checkbox.classList.remove('field-invalid');
        void checkbox.offsetWidth;
        checkbox.classList.add('field-invalid');
        return;
      }
      if (tip) tip.textContent = '';

      var name = (document.getElementById('dropName').value || '').trim();
      var phone = (document.getElementById('dropPhone').value || '').trim();
      var email = (document.getElementById('dropEmail').value || '').trim();

      var btn = document.getElementById('dropSubmitBtn');
      btn.disabled = true;
      btn.textContent = '提交中...';

      try {
        var res = await fetch('/api/order/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            customerName: name,
            customerPhone: phone,
            customerEmail: email,
            requirements: buildRequirements()
          })
        });
        var result = await res.json();
        if (result.success && result.orderNo) {
          try {
            sessionStorage.setItem('longwoo_order_no', result.orderNo);
            sessionStorage.setItem('longwoo_preorder_order_no', result.orderNo);
          } catch (e) {}
          window.location.href = 'preorder-step3.html';
        } else {
          if (tip) tip.textContent = result.error || '提交失败，请重试';
          btn.disabled = false;
          btn.textContent = '提 交';
        }
      } catch (e) {
        if (tip) tip.textContent = '网络错误，请稍后重试';
        btn.disabled = false;
        btn.textContent = '提 交';
      }
    }
  </script>

    }

    .product-price {
      font-size: var(--font-size-xs);
      font-weight: 500;
      color: var(--color-primary);
    }

    /* Right column - form area */
    .form-column {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    /* Locked step 1 (collapsed) */
    .locked-step {
      padding-bottom: var(--space-md);
      margin-bottom: var(--space-md);
      border-bottom: 1px solid var(--color-border-light);
      opacity: 0.4;
    }

    .locked-step-title {
      font-size: var(--font-size-sm);
      color: var(--color-primary-lighter);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .locked-step-title svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    .locked-step-status {
      font-size: var(--font-size-xs);
      color: var(--color-primary-lighter);
    }

    /* Current step 2 */
    .current-step-title {
      font-size: var(--font-size-md);
      font-weight: 600;
      color: var(--color-primary);
      margin-bottom: var(--space-md);
      line-height: var(--line-height-tight);
    }

    /* Product details section */
    .product-details {
      margin-bottom: var(--space-lg);
      padding: var(--space-md);
      background-color: var(--color-surface);
      border-radius: var(--radius-sm);
    }

    .product-detail-item {
      font-size: var(--font-size-xs);
      color: var(--color-primary-light);
      line-height: 1.8;
      padding-left: var(--space-sm);
      position: relative;
    }

    .product-detail-item::before {
      content: '';
      position: absolute;
      left: 0;
      top: 8px;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background-color: var(--color-primary-lighter);
    }

    /* Form fields - two column grid */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-sm);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-group.full-width {
      grid-column: 1 / -1;
    }

    .form-label {
      font-size: var(--font-size-xs);
      color: var(--color-primary-light);
      font-weight: 500;
    }

    .form-input {
      width: 100%;
      padding: 10px var(--space-sm);
      background-color: #F3F3F3;
      border: none;
      border-radius: var(--radius-sm);
      font-size: var(--font-size-sm);
      font-family: var(--font-family);
      color: var(--color-primary);
      outline: none;
      transition: box-shadow 0.2s;
    }

    .form-input::placeholder {
      color: var(--color-primary-lighter);
    }

    .form-input:focus {
      box-shadow: 0 0 0 1.5px rgba(16, 16, 16, 0.15);
    }

    textarea.form-input {
      min-height: 72px;
      resize: vertical;
      line-height: 1.5;
    }

    /* Checkbox */
    .checkbox-group {
      display: flex;
      align-items: flex-start;
      gap: var(--space-sm);
      margin-top: var(--space-lg);
      margin-bottom: var(--space-lg);
    }

    /* 必填校验：标红闪烁 + 提示 */
    .req-star {
      color: var(--color-error, #ef4444);
    }

    .form-tip {
      font-size: var(--font-size-xs, 12px);
      color: var(--color-error, #ef4444);
      margin-top: 8px;
      min-height: 14px;
      text-align: center;
    }

    .field-invalid {
      border-color: var(--color-error, #ef4444) !important;
      animation: field-flash 0.8s ease 3;
    }

    @keyframes field-flash {
      0%, 100% { border-color: var(--color-error, #ef4444); box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.15); }
      50% { border-color: transparent; box-shadow: none; }
    }

    .custom-checkbox {
      width: 18px;
      height: 18px;
      border: 1.5px solid var(--color-border);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 1px;
      background-color: #F3F3F3;
    }

    .custom-checkbox.checked {
      background-color: var(--color-primary);
      border-color: var(--color-primary);
    }

    .custom-checkbox svg {
      width: 12px;
      height: 12px;
      color: var(--color-background);
      opacity: 0;
      transition: opacity 0.15s;
    }

    .custom-checkbox.checked svg {
      opacity: 1;
    }

    .checkbox-label {
      font-size: var(--font-size-sm);
      color: var(--color-primary-light);
      line-height: 1.5;
      cursor: pointer;
    }

    .checkbox-label a {
      color: var(--color-primary);
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    /* Action buttons */
    .action-buttons {
      display: flex;
      gap: var(--space-sm);
    }

    .btn-submit {
      flex: 1;
      padding: 12px var(--space-lg);
      background-color: var(--color-primary);
      color: var(--color-background);
      border: none;
      border-radius: var(--radius-sm);
      font-size: var(--font-size-base);
      font-weight: 600;
      font-family: var(--font-family);
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-submit:hover {
      opacity: 0.85;
    }

    .btn-back {
      padding: 12px var(--space-lg);
      background-color: var(--color-surface);
      color: var(--color-primary-light);
      border: none;
      border-radius: var(--radius-sm);
      font-size: var(--font-size-base);
      font-weight: 500;
      font-family: var(--font-family);
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-back:hover {
      background-color: var(--color-border);
    }

    /* Bottom navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: var(--content-max-width);
      height: var(--bottom-nav-height);
      background-color: var(--color-background);
      border-top: 1px solid var(--color-border-light);
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      text-decoration: none;
      border: none;
      background: none;
      padding: var(--space-xs) var(--space-sm);
    }

    .nav-item svg {
      width: 24px;
      height: 24px;
    }

    .nav-item span {
      font-size: 10px;
      color: var(--color-primary-lighter);
    }

    .nav-item.active svg {
      color: var(--color-primary);
    }

    .nav-item.active span {
      color: var(--color-primary);
      font-weight: 600;
    }

    /* Bottom spacer */
    .bottom-spacer {
      height: calc(var(--bottom-nav-height) + var(--space-lg));
    }
  </style>
<script src="/js/common.js" defer></script>
</body>
</html>
