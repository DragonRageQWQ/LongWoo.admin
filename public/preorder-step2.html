    <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--color-background);
      color: var(--color-primary);
      line-height: var(--line-height);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      max-width: var(--content-max-width);
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
    }

    /* Top navigation bar */
    .top-nav {
      height: var(--nav-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--space-md);
      border-bottom: 1px solid var(--color-border-light);
    }

    .back-btn {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: none;
      background: none;
      color: var(--color-primary);
    }

    .top-nav-title {
      font-size: var(--font-size-md);
      font-weight: 600;
      color: var(--color-primary);
    }

    .lock-icon {
      width: 20px;
      height: 20px;
      color: var(--color-primary);
    }

    /* Info section */
    .info-section {
      padding: var(--space-lg) var(--space-md) var(--space-md);
    }

    .info-title {
      font-size: var(--font-size-xl);
      font-weight: 700;
      color: var(--color-primary);
      margin-bottom: var(--space-sm);
    }

    .info-subtitle {
      font-size: var(--font-size-sm);
      color: var(--color-primary-light);
      margin-bottom: var(--space-xs);
    }

    .info-price {
      font-size: var(--font-size-xs);
      color: var(--color-primary-lighter);
      line-height: 1.6;
    }

    /* Step indicator */
    .step-indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-md) var(--space-lg);
      margin: var(--space-md) var(--space-md);
      background-color: var(--color-surface);
      border-radius: var(--radius-md);
      gap: 0;
    }

    .step-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      position: relative;
    }

    .step-circle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--font-size-xs);
      font-weight: 600;
      margin-bottom: 6px;
      transition: all 0.3s ease;
    }

    .step-circle.active {
      background-color: var(--color-primary);
      color: var(--color-background);
    }

    .step-circle.completed {
      background-color: var(--color-primary);
      color: var(--color-background);
    }

    .step-circle.inactive {
      background-color: var(--color-border);
      color: var(--color-primary-lighter);
    }

    .step-label {
      font-size: 10px;
      color: var(--color-primary-lighter);
      text-align: center;
      white-space: nowrap;
    }

    .step-label.active {
      color: var(--color-primary);
      font-weight: 600;
    }

    .step-label.completed {
      color: var(--color-primary-light);
    }

    .step-line {
      flex: 1;
      height: 2px;
      background-color: var(--color-border);
      margin: 0 4px;
      margin-bottom: 20px;
    }

    .step-line.filled {
      background-color: var(--color-primary);
    }

    /* Main content area - two column layout */
    .main-content {
      display: flex;
      padding: var(--space-md);
      gap: var(--space-md);
    }

    /* Left column - selected product card */
    .product-column {
      flex: 0 0 38%;
      max-width: 38%;
    }

    .product-card {
      border-radius: var(--radius-md);
      overflow: hidden;
      background-color: var(--color-background);
      border: 1.5px solid var(--color-primary);
      position: relative;
    }

    .product-card.selected::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      border-radius: var(--radius-md);
      pointer-events: none;
    }

    .product-card-check {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 20px;
      height: 20px;
      background-color: var(--color-primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    .product-card-check svg {
      width: 12px;
      height: 12px;
      color: var(--color-background);
    }

    .product-thumbnail {
      width: 100%;
      aspect-ratio: 3/4;
      object-fit: cover;
      display: block;
      background-color: var(--color-surface);
    }

    .product-info {
      padding: var(--space-sm);
    }

    .product-name {
      font-size: var(--font-size-xs);
      font-weight: 600;
      color: var(--color-primary);
      margin-bottom: 2px;
    }

    .product-price {
      font-size: var(--font-size-xs);
      font-weight: 500;
      color: var(--color-primary);
    }

    /* Right column - form area */
    .form-column {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    /* Locked step 1 (collapsed) */
    .locked-step {
      padding-bottom: var(--space-md);
      margin-bottom: var(--space-md);
      border-bottom: 1px solid var(--color-border-light);
      opacity: 0.4;
    }

    .locked-step-title {
      font-size: var(--font-size-sm);
      color: var(--color-primary-lighter);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .locked-step-title svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    .locked-step-status {
      font-size: var(--font-size-xs);
      color: var(--color-primary-lighter);
    }

    /* Current step 2 */
    .current-step-title {
      font-size: var(--font-size-md);
      font-weight: 600;
      color: var(--color-primary);
      margin-bottom: var(--space-md);
      line-height: var(--line-height-tight);
    }

    /* Product details section */
    .product-details {
      margin-bottom: var(--space-lg);
      padding: var(--space-md);
      background-color: var(--color-surface);
      border-radius: var(--radius-sm);
    }

    .product-detail-item {
      font-size: var(--font-size-xs);
      color: var(--color-primary-light);
      line-height: 1.8;
      padding-left: var(--space-sm);
      position: relative;
    }

    .product-detail-item::before {
      content: '';
      position: absolute;
      left: 0;
      top: 8px;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background-color: var(--color-primary-lighter);
    }

    /* Form fields - two column grid */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-sm);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-group.full-width {
      grid-column: 1 / -1;
    }

    .form-label {
      font-size: var(--font-size-xs);
      color: var(--color-primary-light);
      font-weight: 500;
    }

    .form-input {
      width: 100%;
      padding: 10px var(--space-sm);
      background-color: #F3F3F3;
      border: none;
      border-radius: var(--radius-sm);
      font-size: var(--font-size-sm);
      font-family: var(--font-family);
      color: var(--color-primary);
      outline: none;
      transition: box-shadow 0.2s;
    }

    .form-input::placeholder {
      color: var(--color-primary-lighter);
    }

    .form-input:focus {
      box-shadow: 0 0 0 1.5px rgba(16, 16, 16, 0.15);
    }

    textarea.form-input {
      min-height: 72px;
      resize: vertical;
      line-height: 1.5;
    }

    /* Checkbox */
    .checkbox-group {
      display: flex;
      align-items: flex-start;
      gap: var(--space-sm);
      margin-top: var(--space-lg);
      margin-bottom: var(--space-lg);
    }

    .custom-checkbox {
      width: 18px;
      height: 18px;
      border: 1.5px solid var(--color-border);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 1px;
      background-color: #F3F3F3;
    }

    .custom-checkbox.checked {
      background-color: var(--color-primary);
      border-color: var(--color-primary);
    }

    .custom-checkbox svg {
      width: 12px;
      height: 12px;
      color: var(--color-background);
      opacity: 0;
      transition: opacity 0.15s;
    }

    .custom-checkbox.checked svg {
      opacity: 1;
    }

    .checkbox-label {
      font-size: var(--font-size-sm);
      color: var(--color-primary-light);
      line-height: 1.5;
      cursor: pointer;
    }

    .checkbox-label a {
      color: var(--color-primary);
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    /* Action buttons */
    .action-buttons {
      display: flex;
      gap: var(--space-sm);
    }

    .btn-submit {
      flex: 1;
      padding: 12px var(--space-lg);
      background-color: var(--color-primary);
      color: var(--color-background);
      border: none;
      border-radius: var(--radius-sm);
      font-size: var(--font-size-base);
      font-weight: 600;
      font-family: var(--font-family);
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-submit:hover {
      opacity: 0.85;
    }

    .btn-back {
      padding: 12px var(--space-lg);
      background-color: var(--color-surface);
      color: var(--color-primary-light);
      border: none;
      border-radius: var(--radius-sm);
      font-size: var(--font-size-base);
      font-weight: 500;
      font-family: var(--font-family);
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-back:hover {
      background-color: var(--color-border);
    }

    /* Bottom navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: var(--content-max-width);
      height: var(--bottom-nav-height);
      background-color: var(--color-background);
      border-top: 1px solid var(--color-border-light);
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      text-decoration: none;
      border: none;
      background: none;
      padding: var(--space-xs) var(--space-sm);
    }

    .nav-item svg {
      width: 24px;
      height: 24px;
    }

    .nav-item span {
      font-size: 10px;
      color: var(--color-primary-lighter);
    }

    .nav-item.active svg {
      color: var(--color-primary);
    }

    .nav-item.active span {
      color: var(--color-primary);
      font-weight: 600;
    }

    /* Bottom spacer */
    .bottom-spacer {
      height: calc(var(--bottom-nav-height) + var(--space-lg));
    }
  </style>
</body>
</html>
