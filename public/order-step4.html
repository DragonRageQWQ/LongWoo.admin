    <!-- Right Column: Locked steps + Active step 5 -->

      </div>

      <!-- Locked Step 2 -->

      <!-- Locked Step 4 -->

        <div class="locked-step-value">
          <span class="tag">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>

          </span>
        </div>
      </div>

      <!-- Active Step 5: Waiting for estimation -->

        <h2 class="active-step-title">第五步：请等待我们的人工估价回复</h2>

        <div class="waiting-content">
          <p class="waiting-text">我们将在工作日9:00-17:00回复报价并与您进行接下来的沟通</p>
          <div class="spinner"></div>
          <div class="order-code">您的订单代码：XXXXXXXXXXXXXXXX</div>
        </div>

    </div>
  </div>

  <!-- Next Step Action: 付款确认 -->

    <button class="next-step-btn" type="button" onclick="window.location.href='order-step5.html'">下一步：付款确认</button>
  </div>

  <!-- Bottom Spacer -->
  <div class="bottom-spacer"></div>

  <!-- Bottom Navigation -->

    <button class="nav-item active" aria-label="估价">

    <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--color-background);
      color: var(--color-primary);
      line-height: var(--line-height);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      max-width: var(--content-max-width);
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
    }

    /* Top navigation bar */
    .top-nav {
      height: var(--nav-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--space-md);
      border-bottom: 1px solid var(--color-border-light);
    }

    .back-btn {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: none;
      background: none;
      color: var(--color-primary);
    }

    .top-nav-title {
      font-size: var(--font-size-md);
      font-weight: 600;
      color: var(--color-primary);
    }

    .lock-icon {
      width: 20px;
      height: 20px;
      color: var(--color-primary);
    }

    /* Info section */
    .info-section {
      padding: var(--space-lg) var(--space-md) var(--space-md);
    }

    .info-title {
      font-size: var(--font-size-xl);
      font-weight: 700;
      color: var(--color-primary);
      margin-bottom: var(--space-sm);
    }

    .info-subtitle {
      font-size: var(--font-size-sm);
      color: var(--color-primary-light);
      margin-bottom: var(--space-xs);
    }

    .info-price {
      font-size: var(--font-size-xs);
      color: var(--color-primary-lighter);
      line-height: 1.6;
    }

    /* Step indicator */
    .step-indicator {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-md) var(--space-lg);
      margin: var(--space-md) var(--space-md);
      background-color: var(--color-surface);
      border-radius: var(--radius-md);
    }

    .step-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      position: relative;
    }

    .step-circle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--font-size-xs);
      font-weight: 600;
      margin-bottom: 6px;
      transition: all 0.3s ease;
    }

    .step-circle.done {
      background-color: var(--color-success);
      color: var(--color-background);
    }

    .step-circle.active {
      background-color: var(--color-primary);
      color: var(--color-background);
    }

    .step-circle.inactive {
      background-color: var(--color-border);
      color: var(--color-primary-lighter);
    }

    .step-label {
      font-size: 10px;
      color: var(--color-primary-lighter);
      text-align: center;
      white-space: nowrap;
    }

    .step-label.done {
      color: var(--color-success);
    }

    .step-label.active {
      color: var(--color-primary);
      font-weight: 600;
    }

    .step-line {
      flex: 1;
      height: 2px;
      background-color: var(--color-border);
      margin: 0 4px;
      margin-bottom: 20px;
    }

    .step-line.done {
      background-color: var(--color-success);
    }

    /* Main content area - two column layout */
    .main-content {
      display: flex;
      padding: var(--space-md);
      gap: var(--space-md);
    }

    /* Left column - locked image area */
    .image-column {
      flex: 0 0 40%;
      max-width: 40%;
    }

    .image-zone-locked {
      width: 179px;
      height: 260px;
      border-radius: var(--radius-md);
      background-color: var(--color-surface);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .image-zone-locked::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(16,16,16,0.02) 0%, rgba(16,16,16,0.06) 100%);
    }

    .locked-overlay {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-sm);
      z-index: 1;
    }

    .locked-icon {
      width: 36px;
      height: 36px;
      color: var(--color-primary-lighter);
    }

    .locked-text {
      font-size: var(--font-size-xs);
      color: var(--color-primary-lighter);
    }

    /* Right column - steps */
    .form-column {
      flex: 1;
      min-width: 0;
    }

    /* Locked steps (compact, gray) */
    .locked-step {
      margin-bottom: var(--space-lg);
      opacity: 0.4;
    }

    .locked-step-title {
      font-size: var(--font-size-xs);
      color: var(--color-primary);
      font-weight: 600;
      margin-bottom: 2px;
    }

    .locked-step-value {
      font-size: var(--font-size-xs);
      color: var(--color-primary-light);
    }

    .locked-step-value .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      background-color: var(--color-surface);
      border-radius: var(--radius-full);
      font-size: 10px;
      color: var(--color-primary-light);
      margin-right: 4px;
      margin-top: 2px;
    }

    .locked-step-value .tag svg {
      width: 10px;
      height: 10px;
      color: var(--color-success);
    }

    .locked-step-note {
      font-size: 9px;
      color: var(--color-primary-lighter);
      margin-top: 2px;
      line-height: 1.5;
    }

    /* Active step */
    .active-step {
      margin-bottom: var(--space-lg);
    }

    .active-step-title {
      font-size: var(--font-size-md);
      font-weight: 600;
      color: var(--color-primary);
      margin-bottom: var(--space-md);
      line-height: var(--line-height-tight);
    }

    /* Waiting state */
    .waiting-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: var(--space-md) 0;
    }

    .waiting-text {
      font-size: var(--font-size-sm);
      color: var(--color-primary-light);
      line-height: 1.6;
      max-width: 200px;
    }

    .order-code {
      font-size: var(--font-size-xs);
      color: var(--color-primary-light);
      margin-top: var(--space-lg);
      padding: var(--space-sm) var(--space-md);
      background-color: var(--color-surface);
      border-radius: var(--radius-sm);
      word-break: break-all;
      letter-spacing: 0.05em;
    }

    /* Spinner animation */
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--color-border);
      border-top-color: var(--color-primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-top: var(--space-lg);
    }

    /* State separator */
    .state-separator {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      padding: var(--space-xl) var(--space-md) var(--space-md);
    }

    .state-separator-label {
      font-size: var(--font-size-xs);
      font-weight: 600;
      color: var(--color-primary-lighter);
      white-space: nowrap;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .state-separator-line {
      flex: 1;
      height: 1px;
      background-color: var(--color-border-light);
    }

    /* Payment section */
    .payment-section {
      padding: var(--space-md);
    }

    .payment-title {
      font-size: var(--font-size-md);
      font-weight: 600;
      color: var(--color-primary);
      margin-bottom: var(--space-md);
      line-height: var(--line-height-tight);
    }

    /* Payment details card */
    .payment-card {
      background-color: var(--color-surface);
      border-radius: var(--radius-md);
      padding: var(--space-md);
      margin-bottom: var(--space-md);
    }

    .payment-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
    }

    .payment-row-label {
      font-size: var(--font-size-sm);
      color: var(--color-primary-light);
    }

    .payment-row-value {
      font-size: var(--font-size-sm);
      color: var(--color-primary);
    }

    .payment-row.discount .payment-row-value {
      color: var(--color-success);
    }

    .payment-divider {
      height: 1px;
      background-color: var(--color-border);
      margin: 8px 0;
    }

    .payment-row.total {
      padding-top: var(--space-sm);
    }

    .payment-row.total .payment-row-label {
      font-weight: 700;
      color: var(--color-primary);
      font-size: var(--font-size-lg);
    }

    .payment-row.total .payment-row-value {
      font-weight: 700;
      color: var(--color-primary);
      font-size: var(--font-size-lg);
    }

    .deposit-note {
      font-size: var(--font-size-xs);
      color: var(--color-primary-light);
      margin-top: var(--space-sm);
      padding-top: var(--space-sm);
      border-top: 1px dashed var(--color-border);
      text-align: center;
    }

    /* Pay button */
    .pay-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 48px;
      background-color: var(--color-primary);
      color: var(--color-background);
      border: none;
      border-radius: var(--radius-sm);
      font-size: var(--font-size-lg);
      font-weight: 600;
      font-family: var(--font-family);
      cursor: pointer;
      letter-spacing: 0.15em;
      transition: opacity 0.2s;
    }

    .pay-btn:hover {
      opacity: 0.85;
    }

    /* Terms */
    .terms-text {
      text-align: center;
      font-size: var(--font-size-xs);
      color: var(--color-primary-lighter);
      margin-top: var(--space-md);
    }

    .terms-link {
      color: var(--color-primary-light);
      text-decoration: underline;
      cursor: pointer;
    }

    /* Payment success section */
    .success-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: var(--space-xl) var(--space-md) var(--space-md);
    }

    .success-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background-color: var(--color-success);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: var(--space-lg);
    }

    .success-icon svg {
      width: 24px;
      height: 24px;
      color: var(--color-background);
    }

    .success-title {
      font-size: var(--font-size-xl);
      font-weight: 700;
      color: var(--color-primary);
      margin-bottom: var(--space-sm);
    }

    .success-subtitle {
      font-size: var(--font-size-sm);
      color: var(--color-primary-light);
      margin-bottom: var(--space-xs);
    }

    .success-desc {
      font-size: var(--font-size-xs);
      color: var(--color-primary-lighter);
      line-height: 1.6;
      max-width: 240px;
    }

    .success-order-code {
      font-size: var(--font-size-xs);
      color: var(--color-primary-light);
      margin-top: var(--space-lg);
      padding: var(--space-sm) var(--space-md);
      background-color: var(--color-surface);
      border-radius: var(--radius-sm);
      word-break: break-all;
      letter-spacing: 0.05em;
    }

    /* Bottom navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: var(--content-max-width);
      height: var(--bottom-nav-height);
      background-color: var(--color-background);
      border-top: 1px solid var(--color-border-light);
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      text-decoration: none;
      border: none;
      background: none;
      padding: var(--space-xs) var(--space-sm);
    }

    .nav-item svg {
      width: 24px;
      height: 24px;
    }

    .nav-item span {
      font-size: 10px;
      color: var(--color-primary-lighter);
    }

    .nav-item.active svg {
      color: var(--color-primary);
    }

    .nav-item.active span {
      color: var(--color-primary);
      font-weight: 600;
    }

    /* Bottom spacer */
    .bottom-spacer {
      height: calc(var(--bottom-nav-height) + var(--space-xl));
    }

    /* Locked image fill */
    .locked-image-fill {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }

    .locked-image-fill img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Action bar */
    .action-bar {
      padding: var(--space-md);
    }

    .next-step-btn {
      display: block;
      width: 100%;
      padding: var(--space-md);
      background-color: var(--color-primary);
      color: var(--color-background);
      border: none;
      border-radius: var(--radius-md);
      font-size: var(--font-size-base);
      font-weight: 600;
      font-family: var(--font-family);
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .next-step-btn:hover {
      opacity: 0.85;
    }
  </style>

  <script>
    (function() {
      try {
        var imgData = sessionStorage.getItem('longwoo_design_ref_image');
        if (imgData) {
          var overlay = document.getElementById('lockedOverlay');
          var fill = document.getElementById('lockedImageFill');
          var img = document.getElementById('lockedImage');
          overlay.style.display = 'none';
          fill.style.display = 'flex';
          img.src = imgData;
        }
      } catch (err) {}
    })();
  </script>
<script src="/js/common.js" defer></script>
</body>
