<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>功能开发中 | LongWoo Studio</title>
    <meta name="description" content="此功能正在开发中，敬请期待。">
    <meta name="robots" content="index, follow">
    <!-- 预连接 Supabase API -->
    <link rel="preconnect" href="https://vwxdjdmvgbfbpivpvxdg.supabase.co">
    <link rel="dns-prefetch" href="https://vwxdjdmvgbfbpivpvxdg.supabase.co">
    <link rel="stylesheet" href="/css/theme.css">
    <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-family);
      background-color: var(--color-background);
      color: var(--color-primary);
      -webkit-font-smoothing: antialiased;
    }

    .page-wrapper {
      max-width: var(--content-max-width);
      margin: 0 auto;
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Bar */
    .top-bar {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: var(--content-max-width);
      height: var(--nav-height);
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--color-border-light);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--space-md);
    }

    .back-btn {
      display: flex;
      align-items: center;
      gap: var(--space-xs);
      font-size: var(--font-size-sm);
      color: var(--color-primary-light);
      text-decoration: none;
      cursor: pointer;
      transition: color 0.2s ease;
    }

    .back-btn:hover { color: var(--color-primary); }

    .back-btn svg { width: 18px; height: 18px; }

    .logo-text {
      font-size: var(--font-size-lg);
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .placeholder {
      width: 40px;
    }

    /* Main Content */
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-2xl) var(--space-lg);
      text-align: center;
      padding-top: var(--nav-height);
    }

    /* Animated Icon */
    .construction-icon {
      width: 120px;
      height: 120px;
      margin-bottom: var(--space-xl);
      position: relative;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .construction-icon svg {
      width: 100%;
      height: 100%;
    }

    .construction-ring {
      position: absolute;
      top: -10px;
      left: -10px;
      width: calc(100% + 20px);
      height: calc(100% + 20px);
      border: 2px dashed var(--color-primary-lightest);
      border-radius: 50%;
      animation: spin 12s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Feature name */
    .feature-name {
      font-size: var(--font-size-xl);
      font-weight: 700;
      color: var(--color-primary);
      margin-bottom: var(--space-sm);
    }

    /* Status badge */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: var(--space-xs);
      padding: var(--space-xs) var(--space-md);
      background: var(--color-primary-lightest2);
      border-radius: var(--radius-full);
      font-size: var(--font-size-sm);
      color: var(--color-primary-light);
      margin-bottom: var(--space-lg);
      font-weight: 500;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--color-warning);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.3); }
    }

    /* Description */
    .description {
      font-size: var(--font-size-base);
      color: var(--color-primary-light);
      line-height: var(--line-height);
      max-width: 320px;
      margin-bottom: var(--space-2xl);
    }

    /* Progress bar */
    .progress-container {
      width: 100%;
      max-width: 280px;
      margin-bottom: var(--space-2xl);
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: var(--color-primary-lightest2);
      border-radius: var(--radius-full);
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 30%;
      background: linear-gradient(90deg, var(--color-primary-light), var(--color-primary));
      border-radius: var(--radius-full);
      animation: progressMove 3s ease-in-out infinite;
    }

    @keyframes progressMove {
      0% { width: 10%; }
      50% { width: 60%; }
      100% { width: 10%; }
    }

    .progress-text {
      text-align: center;
      font-size: var(--font-size-xs);
      color: var(--color-primary-lighter);
      margin-top: var(--space-sm);
      letter-spacing: 0.5px;
    }

    /* Action buttons */
    .actions {
      display: flex;
      gap: var(--space-md);
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: var(--space-xs);
      padding: var(--space-sm) var(--space-xl);
      background: var(--color-primary);
      color: #fff;
      font-size: var(--font-size-sm);
      font-weight: 500;
      border: none;
      border-radius: var(--radius-full);
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
      font-family: inherit;
    }

    .btn-primary:hover {
      opacity: 0.85;
      transform: translateY(-1px);
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: var(--space-xs);
      padding: var(--space-sm) var(--space-xl);
      background: transparent;
      color: var(--color-primary-light);
      font-size: var(--font-size-sm);
      font-weight: 500;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-full);
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
      font-family: inherit;
    }

    .btn-secondary:hover {
      background: var(--color-primary-lightest2);
      color: var(--color-primary);
    }

    .btn-primary svg, .btn-secondary svg {
      width: 16px;
      height: 16px;
    }

    /* Footer */
    .footer-info {
      padding: var(--space-lg);
      text-align: center;
      font-size: var(--font-size-xs);
      color: var(--color-primary-lighter);
    }

    .footer-info a {
      color: var(--color-primary-light);
      text-decoration: none;
    }
    </style>
</head>
<body>
  <div class="page-wrapper">

    <!-- Top Bar -->
    <header class="top-bar">
      <a href="index.html" class="back-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5"/>
          <path d="M12 19L5 12L12 5"/>
        </svg>
        返回
      </a>
      <span class="logo-text">LongWoo</span>
      <div class="placeholder"></div>
    </header>

    <!-- Main Content -->
    <main class="content">

      <!-- Animated Construction Icon -->
      <div class="construction-icon">
        <div class="construction-ring"></div>
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Hard hat -->
          <path d="M20 62 Q20 38 50 38 Q80 38 80 62" fill="#101010"/>
          <ellipse cx="50" cy="62" rx="38" ry="6" fill="#101010"/>
          <!-- Hat detail line -->
          <path d="M50 38 L50 30" stroke="#101010" stroke-width="3" stroke-linecap="round"/>
          <ellipse cx="50" cy="28" rx="8" ry="3" fill="#101010"/>
          <!-- Sparkles -->
          <circle cx="25" cy="30" r="2" fill="#F59E0B"/>
          <circle cx="75" cy="30" r="2" fill="#F59E0B"/>
          <path d="M22 45 L18 49 M22 49 L18 45" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M78 45 L82 49 M78 49 L82 45" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>

      <!-- Feature Name -->
      <h1 class="feature-name" id="feature-name">功能开发中</h1>

      <!-- Status Badge -->
      <div class="status-badge">
        <span class="status-dot"></span>
        正在紧锣密鼓地开发
      </div>

      <!-- Description -->
      <p class="description">
        该功能正在建设中，我们正在努力为您打造更好的体验。<br>
        请耐心等待，很快就会与大家见面！
      </p>

      <!-- Progress bar -->
      <div class="progress-container">
        <div class="progress-bar">
          <div class="progress-fill"></div>
        </div>
        <p class="progress-text">开发进度中...</p>
      </div>

      <!-- Action buttons -->
      <div class="actions">
        <a href="index.html" class="btn-primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9L9 9M9 9V3M9 9L3 3"/>
            <path d="M21 9L15 9M15 9V3M15 9L21 3"/>
            <path d="M3 15L9 15M9 15V21M9 15L3 21"/>
            <path d="M21 15L15 15M15 15V21M15 15L21 21"/>
          </svg>
          返回首页
        </a>
        <a href="order-step1.html" class="btn-secondary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2L3 6V20C3 20.5523 3.44772 21 4 21H20C20.5523 21 21 20.5523 21 20V6L18 2H6Z"/>
            <path d="M3 6H21"/>
            <path d="M16 10C16 12.2091 14.2091 14 12 14C9.79086 14 8 12.2091 8 10"/>
          </svg>
          去看看定制服务
        </a>
      </div>

    </main>

    <!-- Footer -->
    <footer class="footer-info">
      <p>&copy; 2026 LongWoo Studio. All rights reserved.</p>
    </footer>

  </div>

    <script>
    // 从 URL 参数读取功能名称
    (function() {
      const params = new URLSearchParams(window.location.search);
      const feature = params.get('feature');
      if (feature) {
        document.getElementById('feature-name').textContent = decodeURIComponent(feature);
        document.title = feature + ' - 开发中 | LongWoo Studio';
      }
    })();
    </script>
<script src="/js/common.js" defer></script>
</body>
</html>
