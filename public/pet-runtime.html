<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LongWoo Pet Runtime</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #pet-container {
    position: fixed;
    bottom: 20px;
    right: 20px;
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
    z-index: 9999;
    touch-action: none;
  }
  #pet-container:active { cursor: grabbing; }

  /* 桌宠图片容器 */
  .pet-body {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: visible;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.15));
  }

  /* 动画包装层（img 整体承载动画） */
  .pet-anim-wrap {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    transform-origin: center bottom;
    width: 100%;
    height: 100%;
  }
  .pet-anim-wrap img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    image-rendering: auto;
    user-select: none;
    -webkit-user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
    /* 明确按比例显示，避免布局未就绪时的拉伸 */
    max-width: 100%;
    max-height: 100%;
    flex-shrink: 0;
  }

  /* 呼吸动画 */
  @keyframes breathe {
    0%, 100% { transform: scaleY(1) translateY(0); }
    50% { transform: scaleY(1.03) translateY(-2px); }
  }
  .pet-breathe { animation: breathe 3s ease-in-out infinite; }

  /* 开心跳跃 */
  @keyframes happyJump {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    25% { transform: translateY(-12px) rotate(-3deg); }
    50% { transform: translateY(-4px) rotate(0deg); }
    75% { transform: translateY(-12px) rotate(3deg); }
  }
  .pet-happy { animation: happyJump 0.8s ease-in-out infinite; }

  /* 惊讶 */
  @keyframes surprise {
    0% { transform: scale(1); }
    30% { transform: scale(1.1) translateY(-5px); }
    60% { transform: scale(0.95) translateY(2px); }
    100% { transform: scale(1); }
  }
  .pet-surprise { animation: surprise 0.6s ease-out; }

  /* 悲伤 */
  @keyframes sad {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(3px) rotate(1.5deg); }
  }
  .pet-sad { animation: sad 2s ease-in-out infinite; }

  /* 挥手（整图左右摇摆） */
  @keyframes waveSway {
    0%, 100% { transform: rotate(0deg) translateY(0); }
    20% { transform: rotate(-8deg) translateY(2px); }
    40% { transform: rotate(6deg) translateY(-2px); }
    60% { transform: rotate(-6deg) translateY(1px); }
    80% { transform: rotate(4deg) translateY(-1px); }
  }
  .pet-wave { animation: waveSway 0.9s ease-in-out infinite; }

  /* 休眠 */
  @keyframes sleep {
    0%, 100% { transform: translateY(0) scaleY(0.95); }
    50% { transform: translateY(2px) scaleY(0.92); }
  }
  .pet-sleep { animation: sleep 4s ease-in-out infinite; }

  /* 拖拽状态：暂停一切动画 */
  .pet-drag .pet-anim-wrap {
    animation: none !important;
    transform: rotate(-6deg) scale(1.02);
  }

  /* ZZZ 睡眠符号 */
  .zzz {
    position: absolute;
    top: 4%;
    right: 6%;
    font-size: 16px;
    color: #94a3b8;
    font-weight: bold;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .pet-sleep ~ .zzz, .sleeping .zzz { opacity: 1; }

  /* 对话气泡 */
  .speech-bubble {
    position: absolute;
    bottom: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%);
    background: white;
    border-radius: 16px;
    padding: 8px 14px;
    font-size: 13px;
    color: #334155;
    white-space: nowrap;
    box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s, transform 0.3s;
    max-width: 220px;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .speech-bubble::after {
    content: '';
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    border: 6px solid transparent;
    border-top-color: white;
  }
  .speech-bubble.show {
    opacity: 1;
    transform: translateX(-50%) translateY(-4px);
  }

  /* 粒子效果容器 */
  .particles {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: visible;
  }

  /* 加载占位 */
  .pet-img-loading {
    opacity: 0;
    transition: opacity 0.4s;
  }
  .pet-img-loaded {
    opacity: 1;
  }

  /* 工具栏（调试用） */
  #debug-panel {
    position: fixed;
    top: 10px;
    left: 10px;
    background: rgba(0,0,0,0.7);
    color: white;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 11px;
    font-family: monospace;
    display: none;
    z-index: 10000;
  }
  #debug-panel.show { display: block; }
  #debug-panel select, #debug-panel button {
    font-size: 11px;
    margin: 2px;
  }
</style>
</head>
<body>

<div id="pet-container">
  <div class="speech-bubble" id="speech-bubble">你好呀~</div>
  <div class="pet-body" id="pet-body">
    <!-- 预设桌宠形象：用户上传图（pet-user/preset.png，白底已抠除） -->
    <div class="pet-anim-wrap pet-img-loading" id="pet-anim-group">
      <img id="pet-img" src="/pet-user/preset.png" alt="LongWoo Pet" draggable="false" />
    </div>
    <div class="zzz" id="zzz">zZ</div>
    <div class="particles" id="particles"></div>
  </div>
</div>

<!-- 调试面板（灰度测试用） -->
<div id="debug-panel">
  <div>mood: <span id="dbg-mood">idle</span> | voice: <span id="dbg-voice">system</span></div>
  <div>
    <select id="mood-select">
      <option value="idle">idle</option>
      <option value="happy">happy</option>
      <option value="surprise">surprise</option>
      <option value="sad">sad</option>
      <option value="wave">wave</option>
      <option value="sleep">sleep</option>
    </select>
    <button id="btn-speak">说话</button>
    <button id="btn-reset">重置位置</button>
  </div>
  <div>
    <select id="voice-select">
      <option value="">system (default)</option>
    </select>
    <label>pitch <input type="range" id="pitch-range" min="0.5" max="2" step="0.1" value="1" style="width:70px;vertical-align:middle" /></label>
    <span id="pitch-value">1.0</span>
  </div>
</div>

<script>
(function() {
  'use strict';

  // ============== 配置 ==============
  const CONFIG = {
    storageKey: 'longwoo_pet_state',
    idleTimeout: 60000, // 60秒无操作进入休眠
    dragThreshold: 5,
    moods: ['idle', 'happy', 'surprise', 'sad', 'wave', 'sleep'],
    defaultMood: 'idle',
    /** 预设形象默认尺寸（宽/高，可按图片比例微调） */
    defaultSize: { width: 140, height: 150 },
    /** TTS 默认语速 / 音量 / 音调 */
    ttsRate: 1.05,
    ttsVolume: 0.6,
    defaultPitch: 1,
    voiceStorageKey: 'longwoo_pet_voice',
    /** 内置音色（服务端合成，用户无需安装系统语音）相关地址 */
    ttsVoicesApi: '/api/pet/voices',
    ttsSynthApi: '/api/pet/tts',
    /** 内置音色 voiceURI 前缀（与浏览器系统语音区分） */
    builtinPrefix: 'edge:',
  };

  // ============== 状态 ==============
  const state = {
    mood: CONFIG.defaultMood,
    position: { x: null, y: null },
    uid: 'guest',
    textures: null,
    isDragging: false,
    lastActivity: Date.now(),
    sleepTimer: null,
    sleeping: false,
    /** 当前音色 voiceURI（null = 跟随系统默认；edge:* = 内置音色） */
    voiceURI: null,
    /** 音调 0.5~2 */
    voicePitch: CONFIG.defaultPitch,
    /** 系统音色缓存（speechSynthesis.getVoices()） */
    systemVoices: [],
    /** 内置音色缓存（服务端目录 /api/pet/voices） */
    builtinVoices: [],
    /** 合并后的全量音色（host UI 用） */
    voices: [],
  };

  // ============== DOM 引用 ==============
  const container = document.getElementById('pet-container');
  const petBody = document.getElementById('pet-body');
  const animGroup = document.getElementById('pet-anim-group');
  const petImg = document.getElementById('pet-img');
  const speechBubble = document.getElementById('speech-bubble');
  const zzz = document.getElementById('zzz');
  const particles = document.getElementById('particles');
  const debugPanel = document.getElementById('debug-panel');
  const dbgMood = document.getElementById('dbg-mood');
  const dbgVoice = document.getElementById('dbg-voice');
  const moodSelect = document.getElementById('mood-select');
  const voiceSelect = document.getElementById('voice-select');
  const pitchRange = document.getElementById('pitch-range');
  const pitchValue = document.getElementById('pitch-value');
  const btnSpeak = document.getElementById('btn-speak');
  const btnReset = document.getElementById('btn-reset');

  // ============== 尺寸适配（按图片实际宽高比） ==============
  function applySize() {
    const d = CONFIG.defaultSize;
    container.style.width = d.width + 'px';
    container.style.height = d.height + 'px';
    // 若已加载图片，按图片宽高比微调高度（防变形留白）
    if (petImg && petImg.naturalWidth > 0) {
      const ratio = petImg.naturalHeight / petImg.naturalWidth;
      container.style.height = Math.round(d.width * ratio) + 'px';
    }
  }

  // ============== 情绪动画映射 ==============
  const moodAnimClass = {
    idle: 'pet-breathe',
    happy: 'pet-happy',
    surprise: 'pet-surprise',
    sad: 'pet-sad',
    wave: 'pet-wave',
    sleep: 'pet-sleep',
  };

  // ============== 初始化 ==============
  function init() {
    loadState();
    applyPosition();
    applySize();
    // 图片加载完成后再应用尺寸与淡入
    if (petImg.complete) {
      onImgReady();
    } else {
      petImg.addEventListener('load', onImgReady);
      petImg.addEventListener('error', onImgError);
    }
    setMood(CONFIG.defaultMood);
    setupDrag();
    setupClick();
    setupSleepTimer();
    setupPostMessage();
    setupDebug();
    loadBuiltinVoices();
    setupTTS();
    sayHello();
  }

  // ---------- TTS 初始化：内置音色（服务端）+ 系统音色（浏览器） ----------
  function setupTTS() {
    // 1) 拉取内置音色目录（不依赖浏览器语音，用户无需安装系统语音）
    //    由 loadBuiltinVoices() 完成，成功后自动广播音色列表
    // 2) 系统语音（Chrome 首次异步，监听 voiceschanged）
    if ('speechSynthesis' in window) {
      refreshSystemVoices();
      window.speechSynthesis.onvoiceschanged = function() {
        refreshSystemVoices();
      };
    }
    // 兜底：1.5s 后再拉一次并广播全量列表 + 恢复的音色偏好
    setTimeout(function() {
      refreshSystemVoices();
      mergeAndBroadcastVoices();
      syncVoiceUI();
      // 通知宿主当前已恢复的音色偏好（若 iframe 被重新加载）
      postMessageToParent({ type: 'pet:voiceChanged', selected: state.voiceURI, pitch: state.voicePitch });
    }, 1500);
  }

  function onImgReady() {
    applySize();
    animGroup.classList.remove('pet-img-loading');
    animGroup.classList.add('pet-img-loaded');
  }

  function onImgError() {
    console.warn('[pet] 预设图加载失败，回退占位色块');
    petImg.style.display = 'none';
    animGroup.style.background =
      'radial-gradient(circle at 50% 35%, #fcd5ce 0%, #e8a598 60%, #d98c7a 100%)';
    animGroup.style.borderRadius = '45% 45% 40% 40%';
    animGroup.style.width = '60%';
    animGroup.style.margin = '0 auto';
    onImgReady();
  }

  // ============== 状态持久化 ==============
  function loadState() {
    try {
      const saved = localStorage.getItem(CONFIG.storageKey);
      if (saved) {
        const data = JSON.parse(saved);
        if (data.position) state.position = data.position;
        if (data.uid) state.uid = data.uid;
      }
    } catch (e) {
      console.warn('[pet] 读取本地状态失败', e);
    }
    loadVoicePref();
  }

  function saveState() {
    try {
      localStorage.setItem(CONFIG.storageKey, JSON.stringify({
        position: state.position,
        uid: state.uid,
      }));
    } catch (e) {
      console.warn('[pet] 保存状态失败', e);
    }
    saveVoicePref();
  }

  // ---------- TTS 音色偏好持久化（独立键，避免整体状态频繁写） ----------
  function loadVoicePref() {
    try {
      const saved = localStorage.getItem(CONFIG.voiceStorageKey);
      if (saved) {
        const data = JSON.parse(saved);
        if (data && typeof data.voiceURI === 'string') state.voiceURI = data.voiceURI;
        if (data && typeof data.pitch === 'number' && data.pitch >= 0.5 && data.pitch <= 2) {
          state.voicePitch = data.pitch;
        }
      }
    } catch (e) {
      console.warn('[pet] 读取音色偏好失败', e);
    }
  }

  function saveVoicePref() {
    try {
      localStorage.setItem(CONFIG.voiceStorageKey, JSON.stringify({
        voiceURI: state.voiceURI,
        pitch: state.voicePitch,
      }));
    } catch (e) {
      console.warn('[pet] 保存音色偏好失败', e);
    }
  }

  // ---------- 内置音色（服务端合成，用户无需安装系统语音） ----------
  function loadBuiltinVoices() {
    fetch(CONFIG.ttsVoicesApi, { headers: { 'Accept': 'application/json' } })
      .then(function(res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function(data) {
        const list = Array.isArray(data && data.voices) ? data.voices : [];
        state.builtinVoices = list.map(function(v) {
          return {
            voiceURI: v.voiceURI,             // edge:zh-CN-XiaoxiaoNeural
            name: (v.label || '') + ' ' + (v.name || v.id), // 晓晓 Xiaoxiao
            lang: v.lang || 'zh-CN',
            isDefault: false,
            localService: false,
            source: 'builtin',
            engineId: v.id,
          };
        });
        mergeAndBroadcastVoices();
        syncVoiceUI();
      })
      .catch(function(e) {
        console.warn('[pet] 获取内置音色失败（仅使用系统语音）', e);
      });
  }

  // ---------- 系统音色枚举（浏览器 speechSynthesis，异步） ----------
  function refreshSystemVoices() {
    if (!('speechSynthesis' in window)) return;
    try {
      const list = (window.speechSynthesis.getVoices() || []).map(function(v) {
        return {
          voiceURI: v.voiceURI,
          name: v.name,
          lang: v.lang,
          isDefault: !!v.default,
          localService: !!v.localService,
          source: 'system',
          raw: v, // SpeechSynthesisVoice 原生对象，speak 时使用
        };
      });
      // 排序：默认音色优先，其次按语言、名称
      list.sort(function(a, b) {
        if (a.isDefault !== b.isDefault) return a.isDefault ? -1 : 1;
        return a.lang.localeCompare(b.lang) || a.name.localeCompare(b.name);
      });
      state.systemVoices = list;
      mergeAndBroadcastVoices();
    } catch (e) {
      console.warn('[pet] 枚举系统音色失败', e);
    }
  }

  /** 合并内置 + 系统音色并推送宿主 / 刷新调试面板 */
  function mergeAndBroadcastVoices() {
    state.voices = state.builtinVoices.concat(state.systemVoices);
    broadcastVoices();
  }

  function broadcastVoices() {
    const info = (state.voices || []).map(function(v) {
      return {
        voiceURI: v.voiceURI,
        name: v.name,
        lang: v.lang,
        isDefault: v.isDefault,
        localService: v.localService,
        source: v.source || 'system',
      };
    });
    postMessageToParent({ type: 'pet:voices', voices: info, selected: state.voiceURI });
    // 同步调试面板下拉（内置音色优先展示，无需安装）
    if (voiceSelect) {
      voiceSelect.innerHTML = '';
      const optDefault = document.createElement('option');
      optDefault.value = '';
      optDefault.textContent = 'system (default)';
      voiceSelect.appendChild(optDefault);
      if (state.builtinVoices.length > 0) {
        const g1 = document.createElement('optgroup');
        g1.label = '内置音色 (免安装)';
        state.builtinVoices.forEach(function(v) {
          const opt = document.createElement('option');
          opt.value = v.voiceURI;
          opt.textContent = v.name + ' [' + v.lang + ']';
          g1.appendChild(opt);
        });
        voiceSelect.appendChild(g1);
      }
      if (state.systemVoices.length > 0) {
        const g2 = document.createElement('optgroup');
        g2.label = '系统语音 (浏览器)';
        state.systemVoices.forEach(function(v) {
          const opt = document.createElement('option');
          opt.value = v.voiceURI;
          const mark = v.isDefault ? ' ★' : '';
          opt.textContent = v.name + mark + ' [' + v.lang + ']';
          g2.appendChild(opt);
        });
        voiceSelect.appendChild(g2);
      }
      if (state.voiceURI) voiceSelect.value = state.voiceURI;
    }
  }

  /** 同步调试面板的音色显示 + pitch 滑块 */
  function syncVoiceUI() {
    if (dbgVoice) {
      const v = findVoice(state.voiceURI);
      dbgVoice.textContent = v ? v.name : 'system';
    }
    if (voiceSelect && state.voiceURI) voiceSelect.value = state.voiceURI;
    if (pitchRange) pitchRange.value = String(state.voicePitch);
    if (pitchValue) pitchValue.textContent = Number(state.voicePitch).toFixed(1);
  }

  /** voiceURI 是否为内置音色（edge:*） */
  function isBuiltinURI(uri) {
    return typeof uri === 'string' && uri.indexOf(CONFIG.builtinPrefix) === 0;
  }

  /** 按 voiceURI 查找音色（内置或系统；找不到返回 null = 跟随系统默认） */
  function findVoice(uri) {
    if (!uri) return null;
    return (state.voices || []).find(function(v) { return v.voiceURI === uri; }) || null;
  }

  /** 根据语言生成对应的试听示例文本 */
  function previewSampleForLang(lang) {
    const l = (lang || '').toLowerCase();
    if (l.indexOf('zh') === 0) return '你好呀~我是你的小桌宠！';
    if (l.indexOf('ja') === 0) return 'こんにちは！わたしは、あなたのデスクトップペットです！';
    if (l.indexOf('ko') === 0) return '안녕하세요! 저는 당신의 데스크톱 펫이에요!';
    if (l.indexOf('ru') === 0) return 'Привет! Я твой настольный питомец!';
    if (l.indexOf('fr') === 0) return 'Salut ! Je suis ton petit compagnon de bureau !';
    return 'Hello! I am your desktop pet!';
  }

  /** 用当前音色朗读一句试听（无选中音色时：系统中文优先，其次内置中文） */
  function speakPreview() {
    const zh = function(arr) {
      return (arr || []).find(function(v) { return /^zh/i.test(v.lang); }) || null;
    };
    const voice = findVoice(state.voiceURI)
      || zh(state.systemVoices)
      || zh(state.builtinVoices)
      || null;
    speak(previewSampleForLang(voice ? voice.lang : ''), 3000);
  }

  // ============== 位置控制 ==============
  function applyPosition() {
    if (state.position.x !== null && state.position.y !== null) {
      container.style.left = state.position.x + 'px';
      container.style.top = state.position.y + 'px';
      container.style.right = 'auto';
      container.style.bottom = 'auto';
    }
  }

  function resetPosition() {
    state.position = { x: null, y: null };
    container.style.left = '';
    container.style.top = '';
    container.style.right = '20px';
    container.style.bottom = '20px';
    saveState();
    postMessageToParent({ type: 'pet:position', position: null });
  }

  // ============== 拖拽 ==============
  let dragStartX = 0, dragStartY = 0;
  let elemStartX = 0, elemStartY = 0;
  let hasMoved = false;

  function setupDrag() {
    container.addEventListener('mousedown', onDragStart);
    container.addEventListener('touchstart', onDragStart, { passive: false });
    document.addEventListener('mousemove', onDragMove);
    document.addEventListener('touchmove', onDragMove, { passive: false });
    document.addEventListener('mouseup', onDragEnd);
    document.addEventListener('touchend', onDragEnd);
  }

  function onDragStart(e) {
    e.preventDefault();
    state.isDragging = true;
    hasMoved = false;
    const point = e.touches ? e.touches[0] : e;
    dragStartX = point.clientX;
    dragStartY = point.clientY;

    const rect = container.getBoundingClientRect();
    elemStartX = rect.left;
    elemStartY = rect.top;

    container.classList.add('pet-drag');
    resetSleepTimer();
  }

  function onDragMove(e) {
    if (!state.isDragging) return;
    e.preventDefault();
    const point = e.touches ? e.touches[0] : e;
    const dx = point.clientX - dragStartX;
    const dy = point.clientY - dragStartY;

    if (Math.abs(dx) > CONFIG.dragThreshold || Math.abs(dy) > CONFIG.dragThreshold) {
      hasMoved = true;
    }

    let newX = elemStartX + dx;
    let newY = elemStartY + dy;

    // 边界限制
    const maxX = window.innerWidth - container.offsetWidth;
    const maxY = window.innerHeight - container.offsetHeight;
    newX = Math.max(0, Math.min(newX, maxX));
    newY = Math.max(0, Math.min(newY, maxY));

    container.style.left = newX + 'px';
    container.style.top = newY + 'px';
    container.style.right = 'auto';
    container.style.bottom = 'auto';
  }

  function onDragEnd() {
    if (!state.isDragging) return;
    state.isDragging = false;
    container.classList.remove('pet-drag');

    if (hasMoved) {
      const rect = container.getBoundingClientRect();
      state.position = { x: rect.left, y: rect.top };
      saveState();
      postMessageToParent({ type: 'pet:position', position: state.position });
    }
    resetSleepTimer();
  }

  // ============== 点击交互 ==============
  function setupClick() {
    container.addEventListener('click', function(e) {
      if (hasMoved) return; // 拖拽不触发点击
      onPetClick();
    });
  }

  function onPetClick() {
    resetSleepTimer();
    // 随机小动作
    const actions = ['happy', 'wave', 'surprise'];
    const action = actions[Math.floor(Math.random() * actions.length)];
    triggerMood(action, 1500);

    // 随机对话
    const greetings = [
      '你好呀~',
      '嘿嘿~',
      '摸摸头~',
      '有什么事吗？',
      '我超可爱的！',
      '呼呼~',
    ];
    speak(greetings[Math.floor(Math.random() * greetings.length)]);

    // 爱心粒子
    spawnHearts();

    postMessageToParent({ type: 'pet:click' });
  }

  // ============== 情绪系统 ==============
  function setMood(mood) {
    if (!CONFIG.moods.includes(mood)) {
      console.warn('[pet] 未知情绪:', mood);
      return;
    }
    state.mood = mood;
    state.sleeping = mood === 'sleep';
    dbgMood.textContent = mood;

    // 移除所有情绪类
    for (const m of Object.keys(moodAnimClass)) {
      animGroup.classList.remove(moodAnimClass[m]);
    }

    // 添加当前情绪类
    const animClass = moodAnimClass[mood];
    if (animClass) {
      animGroup.classList.add(animClass);
    }

    // ZZZ 显示
    container.classList.toggle('sleeping', state.sleeping);

    postMessageToParent({ type: 'pet:mood', mood: mood });
  }

  /**
   * 临时触发一个情绪动画，完成后回到 idle
   */
  function triggerMood(mood, duration) {
    setMood(mood);
    if (mood !== 'idle' && mood !== 'sleep') {
      setTimeout(() => {
        if (!state.isDragging) {
          setMood('idle');
        }
      }, duration || 1500);
    }
  }

  // ============== 休眠计时器 ==============
  function setupSleepTimer() {
    resetSleepTimer();
  }

  function resetSleepTimer() {
    state.lastActivity = Date.now();
    if (state.sleepTimer) clearTimeout(state.sleepTimer);
    state.sleepTimer = setTimeout(() => {
      if (state.mood !== 'sleep') {
        setMood('sleep');
      }
    }, CONFIG.idleTimeout);
  }

  // ============== 对话气泡 + TTS ==============
  let speechTimer = null;
  // 内置音色播放（服务端合成音频）
  let audioEl = null;
  // 发声序号：用于丢弃被新发声取代的旧合成结果
  let speechSeq = 0;

  /** 打断当前发声（系统语音 + 内置音色播放） */
  function stopSpeaking() {
    if ('speechSynthesis' in window) {
      try { window.speechSynthesis.cancel(); } catch (e) { /* 忽略 */ }
    }
    if (audioEl) {
      try { audioEl.pause(); } catch (e) { /* 忽略 */ }
    }
  }

  /** 内置音色：服务端合成后播放（带序号防乱序，失败回退系统语音） */
  function synthSpeak(text, voiceURI, seq) {
    fetch(CONFIG.ttsSynthApi, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        text: text,
        voice: voiceURI,
        pitch: state.voicePitch,
        rate: CONFIG.ttsRate,
      }),
    })
      .then(function(res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.blob();
      })
      .then(function(blob) {
        if (seq !== speechSeq) return; // 已被更新的发声取代
        const url = URL.createObjectURL(blob);
        if (!audioEl) {
          audioEl = new Audio();
        } else {
          if (audioEl._url) URL.revokeObjectURL(audioEl._url);
          audioEl._url = null;
        }
        audioEl._url = url;
        audioEl.src = url;
        audioEl.volume = CONFIG.ttsVolume;
        const p = audioEl.play();
        if (p && typeof p.catch === 'function') p.catch(function() { /* 自动播放被拦时静默 */ });
      })
      .catch(function(e) {
        console.warn('[pet] 内置音色合成失败，回退系统语音', e);
        if ('speechSynthesis' in window) {
          try {
            const u = new SpeechSynthesisUtterance(text);
            const zh = (state.systemVoices || []).find(function(v) { return /^zh/i.test(v.lang); });
            if (zh) { u.voice = zh.raw; u.lang = zh.lang; }
            u.pitch = state.voicePitch;
            u.rate = CONFIG.ttsRate;
            u.volume = CONFIG.ttsVolume;
            window.speechSynthesis.speak(u);
          } catch (e2) { /* 静默失败 */ }
        }
      });
  }

  function speak(text, duration) {
    // 新发声前打断旧的，避免叠音
    stopSpeaking();
    speechSeq++;
    const seq = speechSeq;

    speechBubble.textContent = text;
    speechBubble.classList.add('show');
    if (speechTimer) clearTimeout(speechTimer);
    speechTimer = setTimeout(() => {
      speechBubble.classList.remove('show');
    }, duration || 2500);

    const voice = findVoice(state.voiceURI);
    // 选中内置音色 → 服务端合成播放
    if (voice && voice.source === 'builtin') {
      synthSpeak(text, voice.voiceURI, seq);
      return;
    }
    // 系统语音路径
    if (!('speechSynthesis' in window)) return;
    try {
      const utterance = new SpeechSynthesisUtterance(text);
      if (voice) {
        // 系统语音：使用原生 SpeechSynthesisVoice
        utterance.voice = voice.raw || null;
        utterance.lang = voice.lang;
      } else {
        // 未选择音色：跟随系统默认，中文优先
        const zhSystem = (state.systemVoices || []).find(function(v) { return /^zh/i.test(v.lang); });
        const zhBuiltin = (state.builtinVoices || []).find(function(v) { return /^zh/i.test(v.lang); });
        if (zhSystem) {
          utterance.voice = zhSystem.raw;
          utterance.lang = zhSystem.lang;
        } else if (zhBuiltin) {
          // 系统无中文语音 → 自动用内置中文音色兜底（用户无需安装语音）
          synthSpeak(text, zhBuiltin.voiceURI, seq);
          return;
        } else {
          utterance.lang = 'zh-CN';
        }
      }
      utterance.pitch = state.voicePitch;
      utterance.rate = CONFIG.ttsRate;
      utterance.volume = CONFIG.ttsVolume;
      window.speechSynthesis.speak(utterance);
    } catch (e) { /* 静默失败 */ }
  }

  /** 设置音色 + 音调，持久化并回传状态 */
  function setVoice(voiceURI, pitch) {
    if (typeof voiceURI === 'string' && voiceURI !== '') {
      state.voiceURI = voiceURI;
    } else {
      state.voiceURI = null; // 空/缺省 = 跟随系统
    }
    if (typeof pitch === 'number' && pitch >= 0.5 && pitch <= 2) {
      state.voicePitch = pitch;
    }
    saveVoicePref();
    syncVoiceUI();
    postMessageToParent({ type: 'pet:voiceChanged', selected: state.voiceURI, pitch: state.voicePitch });
  }

  function sayHello() {
    setTimeout(() => {
      speak('你好呀~我是你的桌宠！');
    }, 800);
  }

  // ============== 粒子效果 ==============
  function spawnHearts() {
    const count = 5;
    for (let i = 0; i < count; i++) {
      setTimeout(() => {
        const heart = document.createElement('div');
        heart.textContent = '❤';
        heart.style.cssText = `
          position: absolute;
          left: ${30 + Math.random() * 60}%;
          top: 40%;
          font-size: ${12 + Math.random() * 8}px;
          color: ${Math.random() > 0.5 ? '#ff6b9d' : '#ff9eb5'};
          pointer-events: none;
          animation: floatUp 1.2s ease-out forwards;
        `;
        particles.appendChild(heart);
        setTimeout(() => heart.remove(), 1200);
      }, i * 80);
    }
  }

  // 添加浮动动画
  const style = document.createElement('style');
  style.textContent = `
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(0.5); }
      100% { opacity: 0; transform: translateY(-40px) scale(1.2) rotate(15deg); }
    }
  `;
  document.head.appendChild(style);

  // ============== postMessage 通信 ==============
  function setupPostMessage() {
    window.addEventListener('message', function(e) {
      const data = e.data;
      if (!data || !data.type || !data.type.startsWith('pet:')) return;

      switch (data.type) {
        case 'pet:mood':
          if (data.mood) setMood(data.mood);
          break;
        case 'pet:speak':
          if (data.text) speak(data.text, data.duration);
          break;
        case 'pet:trigger':
          if (data.mood) triggerMood(data.mood, data.duration);
          break;
        case 'pet:reset':
          resetPosition();
          break;
        case 'pet:config':
          if (data.uid) state.uid = data.uid;
          if (data.textures) applyTextures(data.textures);
          if (data.voiceURI !== undefined || data.pitch !== undefined) {
            setVoice(data.voiceURI !== undefined ? data.voiceURI : state.voiceURI, data.pitch);
          }
          saveState();
          break;
        case 'pet:getVoices':
          // 宿主主动拉取音色列表（内置 + 系统，异步就绪后推送）
          refreshSystemVoices();
          mergeAndBroadcastVoices();
          break;
        case 'pet:setVoice':
          if (data.voiceURI !== undefined || data.pitch !== undefined) {
            setVoice(data.voiceURI, data.pitch);
            // 设置后立即用新音色说一句，方便宿主"试听"
            if (data.preview) speakPreview();
          }
          break;
        case 'pet:debug':
          debugPanel.classList.toggle('show', data.show !== false);
          break;
        case 'pet:ping':
          postMessageToParent({ type: 'pet:pong', ready: true });
          break;
        default:
          console.log('[pet] 未知消息:', data.type);
      }
    });

    // 通知父页面已就绪
    postMessageToParent({ type: 'pet:ready' });
  }

  function postMessageToParent(data) {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage(data, '*');
    }
  }

  // ============== 贴图替换（预留 Spine 接口） ==============
  function applyTextures(textures) {
    // 占位实现：实际项目中这里会替换 Spine 插槽贴图
    // 当前演示版使用整图，若提供 body 贴图则替换主形象
    if (textures && typeof textures.body === 'string') {
      petImg.src = textures.body;
    }
    console.log('[pet] 应用用户贴图:', textures);
    state.textures = textures;
    postMessageToParent({ type: 'pet:texturesApplied' });
  }

  // ============== 调试面板 ==============
  function setupDebug() {
    moodSelect.addEventListener('change', function() {
      triggerMood(this.value, 2000);
    });
    btnSpeak.addEventListener('click', function() {
      speak('这是一个测试语音~', 3000);
    });
    btnReset.addEventListener('click', resetPosition);

    // 音色切换：下拉选择即应用并试听
    voiceSelect.addEventListener('change', function() {
      setVoice(this.value, undefined);
      speakPreview();
    });
    // 音调滑杆：拖动实时应用（不打断）
    pitchRange.addEventListener('input', function() {
      const p = parseFloat(this.value);
      state.voicePitch = p;
      if (pitchValue) pitchValue.textContent = p.toFixed(1);
    });
    pitchRange.addEventListener('change', function() {
      const p = parseFloat(this.value);
      setVoice(state.voiceURI, p);
      speakPreview();
    });

    // URL 参数控制 debug 面板
    const params = new URLSearchParams(window.location.search);
    if (params.get('debug') === '1') {
      debugPanel.classList.add('show');
    }
  }

  // ============== 页面可见性 ==============
  document.addEventListener('visibilitychange', function() {
    if (document.hidden) {
      // 页面隐藏时暂停动画节省性能
      animGroup.style.animationPlayState = 'paused';
    } else {
      animGroup.style.animationPlayState = '';
      resetSleepTimer();
    }
  });

  // 启动
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
