    <style>
    *, *::before, *::after {

      height: 32px;

      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: none;
      background: none;
      color: var(--color-primary);
    }

    .top-nav-title {
      font-size: var(--font-size-md);
      font-weight: 600;
      color: var(--color-primary);
    }

    .lock-icon {
      width: 20px;
      height: 20px;
      color: var(--color-primary);
    }

    /* Info section */
    .info-section {
      padding: var(--space-lg) var(--space-md) var(--space-md);
    }

    .info-title {
      font-size: var(--font-size-xl);
      font-weight: 700;
      color: var(--color-primary);
      margin-bottom: var(--space-sm);
    }

    .info-subtitle {
      font-size: var(--font-size-sm);
      color: var(--color-primary-light);
      margin-bottom: var(--space-xs);
    }

    .info-price {
      font-size: var(--font-size-xs);
      color: var(--color-primary-lighter);
      line-height: 1.6;
    }

    /* Step indicator */
    .step-indicator {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-md) var(--space-lg);
      margin: var(--space-md) var(--space-md);
      background-color: var(--color-surface);
      border-radius: var(--radius-md);
    }

    .step-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      position: relative;
    }

    .step-circle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--font-size-xs);
      font-weight: 600;
      margin-bottom: 6px;
      transition: all 0.3s ease;
    }

    .step-circle.active {
      background-color: var(--color-primary);
      color: var(--color-background);
    }

    .step-circle.inactive {
      background-color: var(--color-border);
      color: var(--color-primary-lighter);
    }

    .step-label {
      font-size: 10px;
      color: var(--color-primary-lighter);
      text-align: center;
      white-space: nowrap;
    }

    .step-label.active {
      color: var(--color-primary);
      font-weight: 600;
    }

    .step-line {
      flex: 1;
      height: 2px;
      background-color: var(--color-border);
      margin: 0 4px;
      margin-bottom: 20px;
    }

    /* Main content area - two column layout */
    .main-content {
      display: flex;
      padding: var(--space-md);
      gap: var(--space-md);
    }

    /* Left column - upload area */
    .upload-column {
      flex: 0 0 40%;
      max-width: 40%;
    }

    .upload-zone {
      border: 2px dashed var(--color-border);
      border-radius: var(--radius-md);
      padding: var(--space-lg) var(--space-sm);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 260px;
      background-color: var(--color-surface);
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s;
      position: relative;
    }

    .upload-zone:hover {
      border-color: var(--color-primary-lighter);
    }

    .upload-zone.uploaded {
      border-style: solid;
      border-color: var(--color-success);
      background-color: rgba(34, 197, 94, 0.04);
    }

    .upload-icon {
      width: 48px;
      height: 48px;
      color: var(--color-primary-lighter);
      margin-bottom: var(--space-md);
    }

    .upload-zone.uploaded .upload-icon {
      color: var(--color-success);
    }

    .upload-text {
      font-size: var(--font-size-xs);
      color: var(--color-primary-lighter);
      line-height: 1.6;
    }

    .upload-zone.uploaded .upload-text {
      color: var(--color-primary-light);
    }

    /* Right column - form area */
    .form-column {
      flex: 1;
      min-width: 0;
    }

    .step-title {
      font-size: var(--font-size-md);
      font-weight: 600;
      color: var(--color-primary);
      margin-bottom: var(--space-lg);
      line-height: var(--line-height-tight);
    }

    .upload-status {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      padding: var(--space-md);
      background-color: rgba(34, 197, 94, 0.08);
      border-radius: var(--radius-sm);
      margin-bottom: var(--space-md);
    }

    .status-check {
      width: 20px;
      height: 20px;
      color: var(--color-success);
      flex-shrink: 0;
    }

    .status-text {
      font-size: var(--font-size-sm);
      color: var(--color-success);
      font-weight: 500;
    }

    .uploaded-file-info {
      padding: var(--space-sm);
      background-color: var(--color-surface);
      border-radius: var(--radius-sm);
      margin-top: var(--space-sm);
    }

    .file-name {
      font-size: var(--font-size-sm);
      color: var(--color-primary);
      font-weight: 500;
      margin-bottom: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-size {
      font-size: var(--font-size-xs);
      color: var(--color-primary-lighter);
    }

    /* Terms section */
    .terms-section {
      padding: var(--space-md) var(--space-md);
      margin-top: var(--space-md);
      border-top: 1px solid var(--color-border-light);
    }

    .terms-title {
      font-size: var(--font-size-sm);
      font-weight: 600;
      color: var(--color-primary);
      margin-bottom: var(--space-md);
    }

    .terms-item {
      font-size: var(--font-size-xs);
      color: var(--color-primary-lighter);
      line-height: 1.8;
      padding-left: var(--space-md);
      position: relative;
      margin-bottom: var(--space-xs);
    }

    .terms-item::before {
      content: '';
      position: absolute;
      left: 0;
      top: 8px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background-color: var(--color-primary-lighter);
    }

    /* Bottom spacer */
    .bottom-spacer {
      height: calc(var(--bottom-nav-height) + var(--space-lg));
    }

    /* Upload placeholder hint */
    .upload-hint {
      font-size: 10px;
      color: var(--color-primary-lighter);
      margin-top: 4px;
    }

    /* Upload preview */
    .upload-preview {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .upload-preview img {
      max-width: 100%;
      max-height: 240px;
      object-fit: contain;
      border-radius: var(--radius-sm);
    }

    .preview-remove {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background-color: rgba(16, 16, 16, 0.7);
      color: #fff;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .preview-remove:hover {
      background-color: var(--color-error);
    }

    /* Next step button */
    .next-step-btn {
      display: block;
      width: 100%;
      padding: var(--space-md);
      margin-top: var(--space-lg);
      background-color: var(--color-primary);
      color: var(--color-background);
      border: none;
      border-radius: var(--radius-md);
      font-size: var(--font-size-base);
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .next-step-btn:disabled {
      background-color: var(--color-border);
      color: var(--color-primary-lighter);
      cursor: not-allowed;
    }

    .next-step-btn:not(:disabled):hover {
      opacity: 0.85;
    }
  </style>

  <script>
    (function() {
      // 每次进入页面都重置上传状态（不持久化）
      var fileInput = document.getElementById('fileInput');
      var uploadZone = document.getElementById('uploadZone');
      var uploadPlaceholder = document.getElementById('uploadPlaceholder');
      var uploadPreview = document.getElementById('uploadPreview');
      var previewImage = document.getElementById('previewImage');
      var removeFile = document.getElementById('removeFile');
      var uploadStatus = document.getElementById('uploadStatus');
      var fileInfo = document.getElementById('fileInfo');
      var fileName = document.getElementById('fileName');
      var fileSize = document.getElementById('fileSize');
      var nextStepBtn = document.getElementById('nextStepBtn');

      function formatSize(bytes) {
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
      }

      function showFile(file) {
        var reader = new FileReader();
        reader.onload = function(e) {
          var dataUrl = e.target.result;
          previewImage.src = dataUrl;
          uploadPlaceholder.style.display = 'none';
          uploadPreview.style.display = 'flex';
          uploadZone.classList.add('uploaded');
          uploadStatus.style.display = 'flex';
          fileName.textContent = file.name;
          fileSize.textContent = formatSize(file.size);
          fileInfo.style.display = 'block';
          nextStepBtn.disabled = false;
          // 保存到 sessionStorage 供后续步骤页面读取
          try {
            sessionStorage.setItem('longwoo_design_ref_image', dataUrl);
            sessionStorage.setItem('longwoo_design_ref_name', file.name);
            sessionStorage.setItem('longwoo_design_ref_size', formatSize(file.size));
          } catch (err) {
            // 存储失败时忽略，不影响当前页预览
          }
        };
        reader.readAsDataURL(file);
      }

      function resetUpload() {
        fileInput.value = '';
        previewImage.src = '';
        uploadPlaceholder.style.display = 'flex';
        uploadPreview.style.display = 'none';
        uploadZone.classList.remove('uploaded');
        uploadStatus.style.display = 'none';
        fileName.textContent = '';
        fileSize.textContent = '';
        fileInfo.style.display = 'none';
        nextStepBtn.disabled = true;
        // 清除存储，保持状态一致
        try {
          sessionStorage.removeItem('longwoo_design_ref_image');
          sessionStorage.removeItem('longwoo_design_ref_name');
          sessionStorage.removeItem('longwoo_design_ref_size');
        } catch (err) {}
      }

      // 点击上传区域触发文件选择
      uploadZone.addEventListener('click', function(e) {
        // 避免点击移除按钮时触发
        if (e.target.closest('.preview-remove')) return;
        fileInput.click();
      });

      // 文件选择后显示预览
      fileInput.addEventListener('change', function() {
        if (fileInput.files && fileInput.files[0]) {
          showFile(fileInput.files[0]);
        }
      });

      // 移除已上传文件
      removeFile.addEventListener('click', function(e) {
        e.stopPropagation();
        resetUpload();
      });

      // 下一步跳转
      nextStepBtn.addEventListener('click', function() {
        if (!nextStepBtn.disabled) {
          window.location.href = 'order-step2.html';
        }
      });

      // 页面加载时确保重置（不保留上次的上传状态）
      window.addEventListener('pageshow', function(event) {
        // 如果是从 bfcache 恢复，也重置
        resetUpload();
      });
    })();
  </script>
<script src="/js/common.js" defer></script>
