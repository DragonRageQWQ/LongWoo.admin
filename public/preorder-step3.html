      margin-bottom: 20px;
    }

      background-color: var(--color-success);

      padding: var(--space-md);
      gap: var(--space-md);

      background-color: var(--color-surface);

      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;

      height: 100%;
      object-fit: cover;
      filter: grayscale(100%) opacity(0.35);
      position: absolute;
      inset: 0;
    }

      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(16,16,16,0.03) 0%, rgba(16,16,16,0.08) 100%);

      font-weight: 600;

    .success-area {

      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: var(--space-lg) var(--space-sm);
    }

    .success-icon-wrap {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background-color: #22C55E;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: var(--space-lg);
      animation: successPopIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      box-shadow: 0 4px 16px rgba(34, 197, 94, 0.3);
    }

    .success-icon-wrap svg {
      width: 32px;
      height: 32px;
      color: #FFFFFF;
      stroke-width: 3;
    }

      0% {
        transform: scale(0);
        opacity: 0;
      }
      60% {
        transform: scale(1.1);
        opacity: 1;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }

    .success-heading {
      font-size: var(--font-size-xl);
      font-weight: 700;
      color: var(--color-primary);
      margin-bottom: var(--space-sm);
      animation: fadeSlideUp 0.6s ease 0.2s both;

      font-size: 10px;
      color: var(--color-primary-lighter);
    }

    .nav-item.active svg {
      color: var(--color-primary);
    }

    .nav-item.active span {
      color: var(--color-primary);
      font-weight: 600;
    }

    /* Bottom spacer */
    .bottom-spacer {
      height: calc(var(--bottom-nav-height) + var(--space-lg));
    }
  </style>
  <script>
    // 显示真实订单代码（来自第二步提交时保存）
    (function () {
      try {
        var orderNo = sessionStorage.getItem('longwoo_preorder_order_no') || sessionStorage.getItem('longwoo_order_no') || '';
        var el = document.getElementById('preorderOrderCode');
        if (orderNo && el) el.textContent = orderNo;
      } catch (e) {}
    })();

    // 复制订单代码
    function copyPreorderCode() {
      var btn = document.getElementById('preorderCopyBtn');
      var orderNo = '';
      try {
        orderNo = sessionStorage.getItem('longwoo_preorder_order_no') || sessionStorage.getItem('longwoo_order_no') || '';
      } catch (e) {}
      if (!orderNo) {
        var el = document.getElementById('preorderOrderCode');
        if (el) orderNo = (el.textContent || '').trim();
      }
      if (!orderNo || /X+/.test(orderNo)) return;
      function done() {
        btn.classList.add('copied');
        btn.textContent = '已复制 ✓';
        setTimeout(function () { btn.classList.remove('copied'); btn.textContent = '复制订单代码'; }, 2000);
      }
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(orderNo).then(done).catch(function () { fallback(); });
        } else { fallback(); }
      } catch (e) { fallback(); }
      function fallback() {
        var ta = document.createElement('textarea');
        ta.value = orderNo;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(ta);
        done();
      }
    }
  </script>
<script src="/js/common.js" defer></script>
</body>
