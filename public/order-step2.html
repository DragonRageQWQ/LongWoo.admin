    function selectOption(el, group) {

      el.classList.add('selected');

    <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;

    body {
      font-family: var(--font-family);
      background-color: var(--color-background);
      color: var(--color-primary);

    }

    .back-btn {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: none;
      background: none;
      color: var(--color-primary);
    }

    .top-nav-title {
      font-size: var(--font-size-md);
      font-weight: 600;
      color: var(--color-primary);
    }

    .lock-icon {
      width: 20px;
      height: 20px;
      color: var(--color-primary);
    }

    /* Info section */
    .info-section {
      padding: var(--space-lg) var(--space-md) var(--space-md);
    }

    .info-title {
      font-size: var(--font-size-xl);
      font-weight: 700;
      color: var(--color-primary);
      margin-bottom: var(--space-sm);
    }

    .info-subtitle {
      font-size: var(--font-size-sm);
      color: var(--color-primary-light);
      margin-bottom: var(--space-xs);
    }

    .info-price {
      font-size: var(--font-size-xs);
      color: var(--color-primary-lighter);
      line-height: 1.6;
    }

    /* Step indicator */
    .step-indicator {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-md) var(--space-lg);
      margin: var(--space-md) var(--space-md);
      background-color: var(--color-surface);
      border-radius: var(--radius-md);
    }

    .step-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      position: relative;
    }

    .step-circle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--font-size-xs);
      font-weight: 600;
      margin-bottom: 6px;
      transition: all 0.3s ease;
    }

    .step-circle.active {
      background-color: var(--color-primary);
      color: var(--color-background);
    }

    .step-circle.completed {
      background-color: var(--color-primary);
      color: var(--color-background);
    }

    .step-circle.inactive {
      background-color: var(--color-border);
      color: var(--color-primary-lighter);
    }

    .step-label {
      font-size: 10px;
      color: var(--color-primary-lighter);
      text-align: center;
      white-space: nowrap;
    }

    .step-label.active {
      color: var(--color-primary);
      font-weight: 600;
    }

    .step-label.completed {
      color: var(--color-primary-light);
    }

    .step-line {
      flex: 1;
      height: 2px;
      background-color: var(--color-border);
      margin: 0 4px;
      margin-bottom: 20px;
    }

    .step-line.filled {
      background-color: var(--color-primary);
    }

    /* Main content area - two column layout */
    .main-content {
      display: flex;
      padding: var(--space-md);
      gap: var(--space-md);
    }

    /* Left column - locked thumbnail */
    .locked-column {
      flex: 0 0 40%;
      max-width: 40%;
    }

    .locked-zone {
      border-radius: var(--radius-md);
      padding: var(--space-md);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 260px;
      background-color: var(--color-surface);
      text-align: center;
      opacity: 0.45;
    }

    .locked-thumbnail {
      width: 100%;
      aspect-ratio: 3/4;
      border-radius: var(--radius-sm);
      background-color: var(--color-border);
      margin-bottom: var(--space-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .locked-thumbnail svg {
      width: 32px;
      height: 32px;
      color: var(--color-primary-lighter);
    }

    .locked-text {
      font-size: var(--font-size-xs);
      color: var(--color-primary-lighter);
    }

    /* Right column - form area */
    .form-column {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    /* Locked step 1 (collapsed) */
    .locked-step {
      padding-bottom: var(--space-md);
      margin-bottom: var(--space-md);
      border-bottom: 1px solid var(--color-border-light);
      opacity: 0.4;
    }

    .locked-step-title {
      font-size: var(--font-size-sm);
      color: var(--color-primary-lighter);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .locked-step-title svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    .locked-step-status {
      font-size: var(--font-size-xs);
      color: var(--color-primary-lighter);
    }

    /* Current step 2 */
    .current-step-title {
      font-size: var(--font-size-md);
      font-weight: 600;
      color: var(--color-primary);
      margin-bottom: var(--space-md);
      line-height: var(--line-height-tight);
    }

    /* Radio options */
    .radio-group {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .radio-option {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      padding: 14px var(--space-sm);
      border-bottom: 1px solid var(--color-border-light);
      cursor: pointer;
      transition: background-color 0.15s;
    }

    .radio-option:last-child {
      border-bottom: none;
    }

    .radio-option:hover {
      background-color: var(--color-surface);
    }

    .radio-circle {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: border-color 0.2s;
    }

    .radio-option.selected .radio-circle {
      border-color: var(--color-primary);
    }

    .radio-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: var(--color-primary);
      transform: scale(0);
      transition: transform 0.2s ease;
    }

    .radio-option.selected .radio-dot {
      transform: scale(1);
    }

    .radio-label {
      font-size: var(--font-size-base);
      color: var(--color-primary);
      line-height: 1.4;
    }

    .radio-price {
      font-size: var(--font-size-sm);
      color: var(--color-primary-light);
      margin-left: auto;
      white-space: nowrap;
      font-weight: 500;
    }

    /* Step 3 preview (faded) */
    .step3-preview {
      margin-top: var(--space-lg);
      padding-top: var(--space-md);
      border-top: 1px solid var(--color-border-light);
      opacity: 0.35;
      transform: translateY(8px);
      pointer-events: none;
      filter: blur(0.5px);
    }

    .step3-preview-title {
      font-size: var(--font-size-base);
      font-weight: 500;
      color: var(--color-primary);
      margin-bottom: var(--space-md);

    .price-row.total .price-row-label {
      font-weight: 600;

      content: '';
      position: absolute;
      left: 0;
      top: 8px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background-color: var(--color-primary-lighter);

    /* Bottom navigation */

      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;

    }

      max-height: 200px;
      object-fit: contain;
      border-radius: var(--radius-sm);
    }

    .locked-filename {
      font-size: var(--font-size-xs);
      color: var(--color-primary-light);
      margin-top: 4px;
      word-break: break-all;
      text-align: center;
    }
  </style>

  <script>
    (function() {
      // 从 sessionStorage 读取 step1 上传的设定图
      try {
        var imgData = sessionStorage.getItem('longwoo_design_ref_image');
        var imgName = sessionStorage.getItem('longwoo_design_ref_name');
        if (imgData) {
          var placeholder = document.getElementById('lockedPlaceholder');
          var preview = document.getElementById('lockedImagePreview');
          var img = document.getElementById('lockedImage');
          var fileName = document.getElementById('lockedFileName');
          placeholder.style.display = 'none';
          preview.style.display = 'flex';
          img.src = imgData;
          if (imgName) {
            fileName.textContent = imgName;
            fileName.style.display = 'block';
          }
        }
      } catch (err) {}
    })();
  </script>
